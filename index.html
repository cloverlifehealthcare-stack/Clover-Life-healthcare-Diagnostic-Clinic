<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Clover Life Payroll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: left rail of sections on desktop (top tabs on phone); working area of ledgers and forms. Clover green accent on green-biased neutrals. */
:root{
  --bg:#f5f7f4; --surface:#ffffff; --sunk:#eef2ec; --line:#dbe3d8; --line-strong:#c3cfbf;
  --fg:#17211a; --muted:#5d6b60; --faint:#8a978c;
  --accent:#1f6b47; --accent-fg:#ffffff; --accent-soft:#e1efe6;
  --good:#1d7a4a; --good-soft:#e2f3e8; --warn:#9a6200; --warn-soft:#fbf0d9; --bad:#b3322a; --bad-soft:#fbe6e3;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1511; --surface:#161e18; --sunk:#1c261f; --line:#2a362d; --line-strong:#3a483d;
  --fg:#e6ede7; --muted:#9daca0; --faint:#6f7e72;
  --accent:#5cc28d; --accent-fg:#0b1a11; --accent-soft:#1d3427;
  --good:#5cc28d; --good-soft:#1b3125; --warn:#e3b05a; --warn-soft:#352a14; --bad:#f08a80; --bad-soft:#3a1d1a;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1511; --surface:#161e18; --sunk:#1c261f; --line:#2a362d; --line-strong:#3a483d;
  --fg:#e6ede7; --muted:#9daca0; --faint:#6f7e72;
  --accent:#5cc28d; --accent-fg:#0b1a11; --accent-soft:#1d3427;
  --good:#5cc28d; --good-soft:#1b3125; --warn:#e3b05a; --warn-soft:#352a14; --bad:#f08a80; --bad-soft:#3a1d1a;
  color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:22px} h2{font-size:19px} h3{font-size:15px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.rail{border-right:1px solid var(--line);background:var(--surface);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;gap:10px;align-items:center}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-size:16px;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
nav{display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;padding:8px 10px;border-radius:6px;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;align-items:center}
nav button:hover{background:var(--sunk);color:var(--fg)}
nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.rail .foot{margin-top:auto;font-size:12px;color:var(--faint)}
main{padding-block:24px 64px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));min-width:0;display:flex;flex-direction:column;gap:20px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head p{margin:4px 0 0;color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.btn{font:inherit;font-weight:600;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);padding:7px 12px;border-radius:6px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding:4px 6px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel>.ph{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.panel>.pb{padding:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.stat .v{font-family:var(--f-mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--muted)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk);white-space:nowrap}
td.r,th.r{text-align:right}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
tfoot td{font-weight:600;background:var(--sunk)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.sub{color:var(--muted);font-size:12px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
input[type=checkbox]{width:auto}
td input.cell{width:76px;padding:5px 6px;text-align:right;font-family:var(--f-mono)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
label.chk{display:flex;gap:8px;align-items:center;font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.empty{padding:36px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--fg);font-family:var(--f-display);font-size:16px}
.note{background:var(--sunk);border-radius:6px;padding:10px 12px;color:var(--muted);font-size:13px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,20,14,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow:auto;z-index:50}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:min(640px,100%);display:flex;flex-direction:column}
.modal.wide{width:min(860px,100%)}
.modal .mh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.modal .mb{padding:18px;display:flex;flex-direction:column;gap:14px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:6px;font-weight:500;z-index:60;max-width:calc(100% - 32px)}
/* payslip preview */
.slip{border:1px solid var(--line-strong);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.slip .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.slip dl{display:grid;grid-template-columns:1fr auto;gap:3px 12px;margin:0;font-size:13px}
.slip dt{color:var(--muted)} .slip dd{margin:0;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.slip .tot{border-top:1px solid var(--line);padding-top:4px;font-weight:600;color:var(--fg)}
.netbar{display:flex;justify-content:space-between;align-items:center;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:10px 14px;font-weight:600}
.netbar .num{font-size:18px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv span:nth-child(odd){color:var(--muted)}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;gap:12px;padding-block:10px;padding-right:max(16px,env(safe-area-inset-right,0px));border-right:0;border-bottom:1px solid var(--line);z-index:20;overflow-x:auto}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
  .brand small,.rail .foot{display:none}
  nav{flex-direction:row}
  nav button{white-space:nowrap;padding:6px 10px}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
  .grid2,.grid3,.slip .cols{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){.btn,nav button{transition:background .12s,border-color .12s}}
body{margin:0}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><g fill="var(--accent)"><circle cx="11" cy="11" r="6"/><circle cx="21" cy="11" r="6"/><circle cx="11" cy="21" r="6"/><circle cx="21" cy="21" r="6"/></g><circle cx="16" cy="16" r="2.4" fill="var(--surface)"/></svg>
      <div><b>Clover Life Payroll</b><small>Clinic &amp; Enterprises</small></div>
    </div>
    <nav id="nav"></nav>
    <div class="foot">Semi-monthly · paid every 5th &amp; 20th<br><button class="btn ghost" data-act="backup" style="padding-left:0">Download backup</button></div>
  </aside>
  <main id="app"><div class="empty"><b>Loading payroll…</b><span>Connecting to your payroll records.</span></div></main>
</div>
<div id="modal-root"></div>

<script>
/*CALC-START*/
const DEFAULT_SETTINGS = {
  companies: [
    { id: "clinic", name: "Clover Life Healthcare Diagnostic Clinic", short: "Clinic" },
    { id: "ent", name: "Clover Life Healthcare Enterprises", short: "Enterprises" }
  ],
  daysFactor: 313,          // working days per year used to get the daily rate (313 = 6-day week, 261 = 5-day week)
  hoursPerDay: 8,
  contribTiming: "split",   // split = half each pay day; A = all on 20th pay; B = all on 5th pay
  sssEE: 0.05, sssER: 0.10, mscMin: 5000, mscMax: 35000, ecLow: 10, ecHigh: 30, ecThreshold: 15000,
  phRate: 0.05, phFloor: 10000, phCeil: 100000,
  piRate: 0.02, piLowRate: 0.01, piLowLimit: 1500, piCap: 10000,
  thirteenthExempt: 90000,
  mult: { otReg: 1.25, rdSh: 1.30, rdShOt: 1.69, rh: 1.00, rhOt: 2.60, nd: 0.10 }
};
const r2 = n => Math.round((Number(n) || 0) * 100 + Number.EPSILON * 100) / 100;
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };

// BIR withholding tax, semi-monthly (TRAIN, 2023 onwards)
const TAX_SEMI = [
  [0, 0, 0], [10417, 0, 0.15], [16667, 937.50, 0.20], [33333, 4270.70, 0.25], [83333, 16770.70, 0.30], [333333, 91770.70, 0.35]
];
function withholdingSemi(taxable) {
  if (taxable <= 10417) return 0;
  let row = TAX_SEMI[0];
  for (const t of TAX_SEMI) if (taxable > t[0]) row = t;
  return r2(row[1] + (taxable - row[0]) * row[2]);
}
function sssMSC(comp, S) {
  const msc = Math.round(comp / 500) * 500;
  return Math.min(S.mscMax, Math.max(S.mscMin, msc));
}
// Monthly contributions on a monthly salary
function monthlyContrib(monthly, S) {
  const msc = sssMSC(monthly, S);
  const ph = Math.min(S.phCeil, Math.max(S.phFloor, monthly)) * S.phRate / 2;
  const piBase = Math.min(S.piCap, monthly);
  const piEE = piBase * (monthly <= S.piLowLimit ? S.piLowRate : S.piRate);
  const piER = piBase * S.piRate;
  return {
    msc,
    sssEE: r2(msc * S.sssEE), sssER: r2(msc * S.sssER), ec: msc < S.ecThreshold ? S.ecLow : S.ecHigh,
    phEE: r2(ph), phER: r2(ph), piEE: r2(piEE), piER: r2(piER)
  };
}
function contribShare(kind, S) {
  if (S.contribTiming === "split") return 0.5;
  return S.contribTiming === kind ? 1 : 0;
}
/*
 emp: {monthlyRate, allowance, mwe, noGov}
 inp: {absentDays, lateMins, otReg, rdSh, rdShOt, rh, rhOt, nd, otherEarn, allowance, otherDed, skipLoans}
 ctx: {kind:'A'|'B', include13, prior13Basic, prior13Paid, loans:[{id,label,perCutoff,balance}]}
*/
function computeLine(emp, inp, ctx, S) {
  inp = inp || {};
  const m = num(emp.monthlyRate);
  const daily = m * 12 / S.daysFactor, hourly = daily / S.hoursPerDay, minute = hourly / 60;
  const basic = r2(m / 2);
  const absent = r2(num(inp.absentDays) * daily);
  const late = r2(num(inp.lateMins) * minute);
  const basicEarned = r2(Math.max(0, basic - absent - late));
  const M = S.mult;
  const prem = {
    otReg: r2(num(inp.otReg) * hourly * M.otReg),
    rdSh: r2(num(inp.rdSh) * hourly * M.rdSh),
    rdShOt: r2(num(inp.rdShOt) * hourly * M.rdShOt),
    rh: r2(num(inp.rh) * hourly * M.rh),
    rhOt: r2(num(inp.rhOt) * hourly * M.rhOt),
    nd: r2(num(inp.nd) * hourly * M.nd)
  };
  const premTotal = r2(Object.values(prem).reduce((a, b) => a + b, 0));
  const otherEarn = r2(num(inp.otherEarn));
  const allowance = r2(inp.allowance !== undefined && inp.allowance !== "" ? num(inp.allowance) : num(emp.allowance));
  // 13th month
  let thirteenth = 0, thirteenthTaxable = 0;
  if (ctx.include13) {
    const total13 = r2((num(ctx.prior13Basic) + basicEarned) / 12);
    thirteenth = r2(Math.max(0, total13 - num(ctx.prior13Paid)));
    const before = num(ctx.prior13Paid), after = before + thirteenth;
    thirteenthTaxable = r2(Math.max(0, after - S.thirteenthExempt) - Math.max(0, before - S.thirteenthExempt));
  }
  const gross = r2(basicEarned + premTotal + otherEarn + allowance + thirteenth);
  // government contributions
  const f = emp.noGov ? 0 : contribShare(ctx.kind, S);
  const mc = monthlyContrib(m, S);
  const gov = {
    msc: mc.msc,
    sssEE: r2(mc.sssEE * f), sssER: r2(mc.sssER * f), ec: r2(mc.ec * f),
    phEE: r2(mc.phEE * f), phER: r2(mc.phER * f),
    piEE: r2(mc.piEE * f), piER: r2(mc.piER * f)
  };
  const eeTotal = r2(gov.sssEE + gov.phEE + gov.piEE);
  const taxable = r2(Math.max(0, basicEarned + premTotal + otherEarn + thirteenthTaxable - eeTotal));
  const tax = emp.mwe ? 0 : withholdingSemi(taxable);
  // loans
  const loans = {};
  let loanTotal = 0;
  if (!inp.skipLoans) for (const l of (ctx.loans || [])) {
    const d = r2(Math.min(num(l.perCutoff), Math.max(0, num(l.balance))));
    if (d > 0) { loans[l.id] = d; loanTotal = r2(loanTotal + d); }
  }
  const otherDed = r2(num(inp.otherDed));
  const deductions = r2(eeTotal + tax + loanTotal + otherDed);
  const net = r2(gross - deductions);
  return { monthlyRate: m, daily: r2(daily), hourly: r2(hourly), basic, absent, late, basicEarned, prem, premTotal,
    otherEarn, allowance, thirteenth, thirteenthTaxable, gross, gov, eeTotal, taxable, tax, loans, loanTotal, otherDed, deductions, net };
}
function pad2(n) { return String(n).padStart(2, "0"); }
function lastDay(y, m) { return new Date(y, m, 0).getDate(); } // m 1-12
// kind A = paid on the 20th for the 1st-15th; kind B = paid on the 5th for the 16th-end of the previous month
function periodFor(y, m, kind) {
  if (kind === "A") return { payDate: `${y}-${pad2(m)}-20`, start: `${y}-${pad2(m)}-01`, end: `${y}-${pad2(m)}-15` };
  let py = y, pm = m - 1; if (pm === 0) { pm = 12; py--; }
  return { payDate: `${y}-${pad2(m)}-05`, start: `${py}-${pad2(pm)}-16`, end: `${py}-${pad2(pm)}-${pad2(lastDay(py, pm))}` };
}
function nextPayDay(today) {
  const y = today.getFullYear(), m = today.getMonth() + 1, d = today.getDate();
  if (d <= 5) return { y, m, kind: "B" };
  if (d <= 20) return { y, m, kind: "A" };
  return m === 12 ? { y: y + 1, m: 1, kind: "B" } : { y, m: m + 1, kind: "B" };
}
/*CALC-END*/

// ---------- state ----------
const st = {
  tab: "overview", settings: null, employees: [], loans: [], runs: [],
  openRun: null, readOnly: false, ready: false, empFilter: "all", empSearch: "", showInactive: false,
  reportMonth: null, year13: new Date().getFullYear()
};

const S = () => Object.assign({}, DEFAULT_SETTINGS, st.settings || {}, { mult: Object.assign({}, DEFAULT_SETTINGS.mult, (st.settings || {}).mult || {}) });
const companies = () => S().companies || DEFAULT_SETTINGS.companies;
const coName = id => (companies().find(c => c.id === id) || {}).name || id;
const coShort = id => (companies().find(c => c.id === id) || {}).short || coName(id);
const empById = id => st.employees.find(e => e.id === id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const peso = n => "₱" + (Number(n) || 0).toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const amt = n => (Number(n) || 0).toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function fdate(s) { if (!s) return ""; const [y, m, d] = s.split("-").map(Number); return `${MONTHS[m - 1]} ${d}, ${y}`; }
function fshort(s) { if (!s) return ""; const [, m, d] = s.split("-").map(Number); return `${MONTHS[m - 1]} ${d}`; }
const periodLabel = r => `${fshort(r.periodStart)}–${fdate(r.periodEnd)}`;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}

// ---------- local storage ----------
const STORE_KEY = "cloverLifePayroll.v1";
let store = { settings: null, employees: {}, loans: {}, runs: {} };
let storageOK = true;
function storageWorks() {
  try { localStorage.setItem(STORE_KEY + ".test", "1"); const ok = localStorage.getItem(STORE_KEY + ".test") === "1"; localStorage.removeItem(STORE_KEY + ".test"); return ok; } catch (e) { return false; }
}
const isPreview = location.protocol !== "file:" && !/^https?:$/.test(location.protocol) || window.self !== window.top;
function loadStore() {
  storageOK = storageWorks();
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) store = Object.assign({ settings: null, employees: {}, loans: {}, runs: {} }, JSON.parse(raw)); }
  catch (e) { storageOK = false; }
}
function saveStore() {
  store.savedAt = new Date().toISOString();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); }
  catch (e) { storageOK = false; toast("Couldn't save in this browser. Download a backup now."); }
}
const clone = o => JSON.parse(JSON.stringify(o));
function syncState() {
  st.settings = store.settings ? clone(store.settings) : null;
  st.employees = Object.entries(store.employees).map(([id, d]) => Object.assign({ id }, clone(d)));
  st.loans = Object.entries(store.loans).map(([id, d]) => Object.assign({ id }, clone(d)));
  const open = {}; st.runs.forEach(r => open[r.id] = r);
  st.runs = Object.entries(store.runs).map(([id, d]) => Object.assign({ id }, clone(d)));
}
function writeLocal(path, data) {
  const [col, id] = path.split("/");
  if (col === "settings") store.settings = data ? clone(data) : null;
  else if (data === null) delete store[col][id];
  else store[col][id] = clone(data);
  saveStore(); syncState(); render();
  return Promise.resolve();
}
const setDoc = (path, data) => writeLocal(path, data);
const delDoc = path => writeLocal(path, null);

// ---------- derived ----------
function finalizedRuns() { return st.runs.filter(r => r.status === "final"); }
function loanPaid(loanId, excludeRunId) {
  let t = 0;
  for (const r of finalizedRuns()) {
    if (r.id === excludeRunId) continue;
    for (const res of Object.values(r.results || {})) t += num((res.loans || {})[loanId]);
  }
  return r2(t + loans_manual(loanId));
}
function loans_manual(loanId) { const l = st.loans.find(x => x.id === loanId); return l ? num(l.paidBefore) : 0; }
function loanBalance(l, excludeRunId) { return r2(num(l.principal) - loanPaid(l.id, excludeRunId)); }
function runEmployees(run) {
  if (run.status === "final") return Object.keys(run.results || {});
  return st.employees.filter(e => e.status !== "inactive" && (run.company === "all" || e.company === run.company))
    .sort((a, b) => (a.name || "").localeCompare(b.name || "")).map(e => e.id);
}
function prior13(empId, year, excludeRunId) {
  let basic = 0, paid = 0;
  for (const r of finalizedRuns()) {
    if (r.id === excludeRunId) continue;
    if (!r.periodEnd || r.periodEnd.slice(0, 4) !== String(year)) continue;
    const res = (r.results || {})[empId]; if (!res) continue;
    basic += num(res.basicEarned); paid += num(res.thirteenth);
  }
  return { basic: r2(basic), paid: r2(paid) };
}
function lineFor(run, empId) {
  if (run.status === "final") return (run.results || {})[empId];
  const emp = empById(empId); if (!emp) return null;
  const year = (run.periodEnd || run.payDate).slice(0, 4);
  const p = prior13(empId, year, run.id);
  const loans = st.loans.filter(l => l.employeeId === empId && l.status !== "closed")
    .map(l => ({ id: l.id, label: l.type, perCutoff: l.perCutoff, balance: loanBalance(l, run.id) }));
  const res = computeLine(emp, (run.lines || {})[empId], { kind: run.kind, include13: !!run.include13, prior13Basic: p.basic, prior13Paid: p.paid, loans }, S());
  res.emp = { name: emp.name, code: emp.code, position: emp.position, company: emp.company, tin: emp.tin, sss: emp.sss, philhealth: emp.philhealth, pagibig: emp.pagibig, mwe: !!emp.mwe };
  res.loanLabels = Object.fromEntries(loans.map(l => [l.id, l.label]));
  res.loanBalAfter = Object.fromEntries(loans.map(l => [l.id, r2(l.balance - num(res.loans[l.id]))]));
  return res;
}
function runTotals(run) {
  const t = { gross: 0, net: 0, ee: 0, tax: 0, loans: 0, er: 0, count: 0 };
  for (const id of runEmployees(run)) {
    const l = lineFor(run, id); if (!l) continue;
    t.count++; t.gross += l.gross; t.net += l.net; t.ee += l.eeTotal; t.tax += l.tax; t.loans += l.loanTotal;
    t.er += l.gov.sssER + l.gov.ec + l.gov.phER + l.gov.piER;
  }
  for (const k in t) if (k !== "count") t[k] = r2(t[k]);
  return t;
}

function remitData(month) {
  const runs = finalizedRuns().filter(r => (r.periodEnd || "").slice(0, 7) === month);
  const per = {};
  for (const r of runs) for (const [id, l] of Object.entries(r.results || {})) {
    const e = l.emp || {}; const k = id;
    const p = per[k] || (per[k] = { name: e.name, company: e.company, sss: e.sss, philhealth: e.philhealth, pagibig: e.pagibig, tin: e.tin, gross: 0, sssEE: 0, sssER: 0, ec: 0, phEE: 0, phER: 0, piEE: 0, piER: 0, tax: 0 });
    p.gross += l.gross; p.tax += l.tax; for (const g of ["sssEE", "sssER", "ec", "phEE", "phER", "piEE", "piER"]) p[g] += l.gov[g];
  }
  const list = Object.values(per).map(p => { for (const k in p) if (typeof p[k] === "number") p[k] = r2(p[k]); return p; });
  return { runs, list };
}
function vReports() {
  const months = [...new Set(finalizedRuns().map(r => (r.periodEnd || "").slice(0, 7)).filter(Boolean))].sort().reverse();
  if (!st.reportMonth || !months.includes(st.reportMonth)) st.reportMonth = months[0] || null;
  if (!st.reportMonth) return `<div class="head"><div><h1>Remittances</h1><p>Monthly totals to pay SSS, PhilHealth, Pag-IBIG and BIR.</p></div></div><div class="panel"><div class="empty"><b>No finalized payroll yet</b><span>Totals appear here once you finalize a payroll run.</span></div></div>`;
  const { runs, list } = remitData(st.reportMonth);
  const [yy, mm] = st.reportMonth.split("-").map(Number);
  const cos = companies().map(c => ({ c, rows: list.filter(p => p.company === c.id) })).filter(x => x.rows.length);
  const sum = (rows, k) => r2(rows.reduce((a, p) => a + p[k], 0));

    ${loanBal ? `<div class="sub">Loan balances after this pay day: ${loanBal}</div>` : ""}${inp.note ? `<div class="sub">Note: ${esc(inp.note)}</div>` : ""}
  </div></div>
  <div class="mf"><span class="sub">Employer share: SSS ${amt(l.gov.sssER + l.gov.ec)} · PhilHealth ${amt(l.gov.phER)} · Pag-IBIG ${amt(l.gov.piER)}</span><div class="row"><button class="btn" data-act="dl-one" data-run="${run.id}" data-emp="${empId}">Download</button><button class="btn primary" data-act="print-one" data-run="${run.id}" data-emp="${empId}">Print payslip</button></div></div>`, true);
}

// ---------- downloads ----------
function offer(filename, data, type) {
  const blob = new Blob([data], { type: type || (filename.endsWith(".csv") ? "text/csv" : filename.endsWith(".json") ? "application/json" : "text/html") });
  const url = URL.createObjectURL(blob); const a = document.createElement("a");
  a.href = url; a.download = filename.replace(/[\\/:*?"<>|]/g, "-"); document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000); toast("Downloaded " + filename);
}
function printDoc(html) {
  const w = window.open("", "_blank"); if (!w) { toast("Allow pop-ups to print, or use Download instead."); return; }
  w.document.write(html.replace("</body>", "<script>window.onload=()=>{window.print()}<\/script></body>")); w.document.close();
}
function payslipDoc(run, empIds) {
  const slips = empIds.map(id => {
    const l = lineFor(run, id); if (!l) return ""; const inp = (run.lines || {})[id] || {};
    const { e, earn, ded } = slipHTML(run, l, inp);
    const tr = (k, v) => v ? `<tr><td>${esc(k)}</td><td class="r">${amt(v)}</td></tr>` : "";
    const loanBal = Object.entries(l.loanBalAfter || {}).map(([lid, b]) => `${esc((l.loanLabels || {})[lid])}: ${amt(b)}`).join(" · ");
    return `<section class="slip"><header><div><div class="co">${esc(coName(e.company))}</div><div class="t">PAYSLIP</div></div><div class="pd">Pay day: <b>${fdate(run.payDate)}</b><br>Period: ${periodLabel(run)}</div></header>
    <div class="who"><b>${esc(e.name)}</b> ${e.code ? "· " + esc(e.code) : ""} ${e.position ? "· " + esc(e.position) : ""}<br><small>SSS ${esc(e.sss || "—")} · PhilHealth ${esc(e.philhealth || "—")} · Pag-IBIG ${esc(e.pagibig || "—")} · TIN ${esc(e.tin || "—")}</small></div>
    <div class="cols"><table><thead><tr><th>Earnings</th><th class="r">₱</th></tr></thead><tbody>${earn.map(([k, v]) => tr(k, v)).join("")}</tbody><tfoot><tr><td>Gross pay</td><td class="r">${amt(l.gross)}</td></tr></tfoot></table>
    <table><thead><tr><th>Deductions</th><th class="r">₱</th></tr></thead><tbody>${ded.map(([k, v]) => tr(k, v)).join("")}</tbody><tfoot><tr><td>Total deductions</td><td class="r">${amt(l.deductions)}</td></tr></tfoot></table></div>
    <div class="net">NET PAY <span>₱ ${amt(l.net)}</span></div>
    ${loanBal ? `<small>Loan balance after this pay: ${loanBal}</small>` : ""} ${inp.note ? `<small>Note: ${esc(inp.note)}</small>` : ""}
    <div class="sign"><span>Prepared by</span><span>Received by / Date</span></div></section>`;
  }).join("");
  return `<!doctype html><html><head><meta charset="utf-8"><title>Payslips ${run.payDate}</title><style>
  @page{size:A4;margin:10mm} body{font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#111;margin:0}
  .slip{border:1px solid #444;padding:10px 12px;height:136mm;box-sizing:border-box;margin-bottom:5mm;page-break-inside:avoid;display:flex;flex-direction:column;gap:6px}
  .slip:nth-of-type(2n){page-break-after:always}
  header{display:flex;justify-content:space-between;border-bottom:2px solid #1f6b47;padding-bottom:4px}
  .co{font-weight:bold;font-size:13px;color:#1f6b47}.t{letter-spacing:.2em;font-size:10px}.pd{text-align:right}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px} table{width:100%;border-collapse:collapse} th,td{padding:2px 4px;border-bottom:1px solid #ddd;text-align:left} th{background:#eef2ec}
  .r{text-align:right} tfoot td{font-weight:bold;border-top:1px solid #444}
  .net{background:#e1efe6;color:#123d29;font-weight:bold;padding:6px 8px;display:flex;justify-content:space-between;font-size:13px}
  .sign{margin-top:auto;display:flex;justify-content:space-between;gap:20px}.sign span{flex:1;border-top:1px solid #444;padding-top:2px;text-align:center;margin-top:22px}
  small{color:#444}
  </style></head><body>${slips}</body></html>`;
}
function csv(rows) { return rows.map(r => r.map(v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(",")).join("\n"); }
function registerCSV(run) {
  const head = ["Employee ID", "Name", "Company", "Position", "Monthly rate", "Basic", "Absences", "Late/UT", "Overtime", "RD/Special holiday", "Regular holiday", "Night diff", "Other earnings", "Allowance", "13th month", "Gross", "SSS EE", "PhilHealth EE", "Pag-IBIG EE", "Taxable", "Withholding tax", "Loans", "Other deductions", "Net pay", "SSS ER", "EC", "PhilHealth ER", "Pag-IBIG ER"];
  const rows = runEmployees(run).map(id => { const l = lineFor(run, id); const e = l.emp || {};
    return [e.code, e.name, coShort(e.company), e.position, l.monthlyRate, l.basic, l.absent, l.late, l.prem.otReg, r2(l.prem.rdSh + l.prem.rdShOt), r2(l.prem.rh + l.prem.rhOt), l.prem.nd, l.otherEarn, l.allowance, l.thirteenth, l.gross, l.gov.sssEE, l.gov.phEE, l.gov.piEE, l.taxable, l.tax, l.loanTotal, l.otherDed, l.net, l.gov.sssER, l.gov.ec, l.gov.phER, l.gov.piER]; });
  return csv([head, ...rows]);
}

// ---------- actions ----------
async function finalizeRun(run) {
  const results = {};
  for (const id of runEmployees(run)) { const l = lineFor(run, id); if (l) results[id] = JSON.parse(JSON.stringify(l)); }
  const doc = Object.assign({}, run, { status: "final", results, finalizedAt: new Date().toISOString() }); delete doc.id;
  Object.assign(run, doc);
  setDoc("runs/" + run.id, doc).then(() => toast("Payroll finalized"));
  render(true);
}
function confirmModal(title, body, act, label, data) {
  openModal(`<div class="mh"><h2>${title}</h2></div><div class="mb"><p style="margin:0">${body}</p></div>
  <div class="mf"><span></span><div class="row"><button class="btn" data-act="close">Cancel</button><button class="btn ${act.startsWith("do-del") ? "danger" : "primary"}" data-act="${act}" ${Object.entries(data || {}).map(([k, v]) => `data-${k}="${esc(v)}"`).join(" ")}>${label}</button></div></div>`);
}

document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-tab],[data-act],[data-open-run],[data-edit-emp],[data-edit-loan],[data-more],[data-slip],[data-scrim]");
  if (!t) return;
  if (t.hasAttribute("data-scrim")) { if (ev.target === t) closeModal(); return; }
  if (t.dataset.tab) { st.tab = t.dataset.tab; st.openRun = null; render(true); window.scrollTo(0, 0); return; }
  if (t.dataset.openRun) { st.tab = "runs"; st.openRun = t.dataset.openRun; render(true); window.scrollTo(0, 0); return; }
  if (t.dataset.editEmp) return empModal(t.dataset.editEmp);
  if (t.dataset.editLoan) return loanModal(t.dataset.editLoan);
  if (t.dataset.more) return moreModal(st.openRun, t.dataset.more);
  if (t.dataset.slip) return slipPreview(st.runs.find(r => r.id === st.openRun), t.dataset.slip);
  const run = st.runs.find(r => r.id === st.openRun);
  switch (t.dataset.act) {
    case "close": return closeModal();
    case "new-emp": return empModal(null);
    case "save-emp": return saveEmp(t.dataset.id);
    case "del-emp": { const id = t.dataset.id; const inRuns = finalizedRuns().some(r => (r.results || {})[id]);
      if (inRuns) { const e = Object.assign({}, empById(id), { status: "inactive" }); delete e.id; setDoc("employees/" + id, e).then(() => toast("Marked inactive")); return closeModal(); }
      return confirmModal("Delete employee?", `${esc(empById(id)?.name)} has no finalized payroll and will be removed.`, "do-del-emp", "Delete", { id }); }
    case "do-del-emp": delDoc("employees/" + t.dataset.id).then(() => toast("Employee deleted")); return closeModal();
    case "new-loan": return loanModal(null);
    case "save-loan": return saveLoan(t.dataset.id);
    case "del-loan": return confirmModal("Delete loan?", "This loan has no deductions yet and will be removed.", "do-del-loan", "Delete", { id: t.dataset.id });
    case "do-del-loan": delDoc("loans/" + t.dataset.id).then(() => toast("Loan deleted")); return closeModal();
    case "new-run": return newRunModal(+t.dataset.y, +t.dataset.m, t.dataset.kind);
    case "create-run": return createRun();
    case "back-runs": st.openRun = null; return render(true);
    case "save-more": return saveMore(t.dataset.run, t.dataset.emp);
    case "finalize": { const tt = runTotals(run);
      return confirmModal("Finalize this payroll?", `Net pay of <b>${peso(tt.net)}</b> for ${tt.count} employees on ${fdate(run.payDate)}. Amounts are locked, loan balances go down, and payslips become available. You can reopen it later if you need to correct something.`, "do-finalize", "Finalize payroll"); }
    case "do-finalize": closeModal(); return finalizeRun(run);
    case "reopen": return confirmModal("Reopen this payroll?", "It goes back to draft and is recomputed from current employee rates and loan balances. Finalize it again when done.", "do-reopen", "Reopen");
    case "do-reopen": { closeModal(); const doc = Object.assign({}, run, { status: "draft" }); delete doc.id; delete doc.results; delete doc.finalizedAt; delete run.results; run.status = "draft"; setDoc("runs/" + run.id, doc); return render(true); }
    case "del-run": return confirmModal("Delete this draft?", "The attendance entered for this pay day will be removed.", "do-del-run", "Delete draft");
    case "do-del-run": { closeModal(); const id = run.id; st.runs = st.runs.filter(r => r.id !== id); st.openRun = null; delDoc("runs/" + id); return render(true); }
    case "dl-slips": return offer(`Payslips ${run.payDate} ${run.company === "all" ? "All" : coShort(run.company)}.html`, payslipDoc(run, runEmployees(run)));
    case "dl-one": { const r = st.runs.find(x => x.id === t.dataset.run); const e = lineFor(r, t.dataset.emp).emp || {}; return offer(`Payslip ${r.payDate} ${e.name}.html`, payslipDoc(r, [t.dataset.emp])); }
    case "print-slips": return printDoc(payslipDoc(run, runEmployees(run)));
    case "print-one": { const r = st.runs.find(x => x.id === t.dataset.run); return printDoc(payslipDoc(r, [t.dataset.emp])); }
    case "backup": { const d = new Date(); return offer(`Clover Life Payroll backup ${d.toISOString().slice(0, 10)}.json`, JSON.stringify(Object.assign({ app: "clover-life-payroll", version: 1, exportedAt: d.toISOString() }, store), null, 1)); }
    case "restore": return document.getElementById("restore-file").click();
    case "do-restore": { closeModal(); if (!pendingRestore) return; store = pendingRestore; pendingRestore = null; saveStore(); syncState(); st.openRun = null; render(true); return toast("Backup restored"); }
    case "dl-register": return offer(`Payroll register ${run.payDate}.csv`, registerCSV(run));
    case "dl-13": { const y = st.year13; const rows = st.employees.map(e => { const p = prior13(e.id, y); return [e.code, e.name, coShort(e.company), p.basic, r2(p.basic / 12), p.paid, r2(Math.max(0, p.basic / 12 - p.paid))]; });
      return offer(`13th month ${y}.csv`, csv([["Employee ID", "Name", "Company", "Basic earned", "13th month to date", "Paid", "Remaining"], ...rows])); }
    case "dl-remit": { const { list } = remitData(st.reportMonth);
      return offer(`Remittances ${st.reportMonth}.csv`, csv([["Name", "Company", "SSS no.", "SSS EE", "SSS ER", "EC", "PhilHealth no.", "PhilHealth EE", "PhilHealth ER", "Pag-IBIG no.", "Pag-IBIG EE", "Pag-IBIG ER", "TIN", "Gross", "Tax withheld"],
        ...list.map(p => [p.name, coShort(p.company), p.sss, p.sssEE, p.sssER, p.ec, p.philhealth, p.phEE, p.phER, p.pagibig, p.piEE, p.piER, p.tin, p.gross, p.tax])])); }
    case "save-settings": {
      const s = S(); const out = { companies: s.companies.map((c, i) => ({ id: c.id, name: val("set-co-" + i) || c.name, short: val("set-cos-" + i) })), daysFactor: num(val("set-daysFactor")), hoursPerDay: num(val("set-hoursPerDay")) || 8, contribTiming: val("set-contribTiming"), mult: {} };
      for (const k of ["sssEE", "sssER", "mscMin", "mscMax", "phRate", "phFloor", "phCeil", "piRate", "piCap"]) out[k] = num(val("set-" + k));
      for (const k of Object.keys(DEFAULT_SETTINGS.mult)) out.mult[k] = num(val("set-m-" + k));
      st.settings = Object.assign({}, st.settings, out);
      setDoc("settings/main", st.settings).then(() => toast("Settings saved")); return render(true);
    }
  }
});
document.addEventListener("change", ev => {
  const el = ev.target;
  if (el.id === "restore-file" && el.files && el.files[0]) {
    const f = el.files[0]; const rd = new FileReader();
    rd.onload = () => { try { const d = JSON.parse(rd.result); if (d.app !== "clover-life-payroll") throw 0;
        pendingRestore = { settings: d.settings || null, employees: d.employees || {}, loans: d.loans || {}, runs: d.runs || {} };
        confirmModal("Restore this backup?", `Backup from <b>${esc((d.exportedAt || "").slice(0, 10))}</b> with ${Object.keys(pendingRestore.employees).length} employees and ${Object.keys(pendingRestore.runs).length} payroll runs. It replaces everything currently in this browser.`, "do-restore", "Restore backup");
      } catch (e) { toast("That file isn't a Clover Life Payroll backup."); } };
    rd.readAsText(f); el.value = ""; return;
  }
  if (el.id === "emp-filter") { st.empFilter = el.value; return render(true); }
  if (el.id === "emp-inactive") { st.showInactive = el.checked; return render(true); }
  if (el.id === "year13") { st.year13 = +el.value; return render(true); }
  if (el.id === "rep-month") { st.reportMonth = el.value; return render(true); }
  if (el.id === "r-month" || el.id === "r-kind" || el.id === "r-co") return updateRunPreview();
  if (el.id === "run-13") { const run = st.runs.find(r => r.id === st.openRun); run.include13 = el.checked; const d = Object.assign({}, run); delete d.id; setDoc("runs/" + run.id, d); return render(true); }
  if (el.dataset && el.dataset.line) {
    const run = st.runs.find(r => r.id === st.openRun); const empId = el.dataset.line;
    const cur = Object.assign({}, (run.lines || {})[empId] || {});
    if (el.value.trim() === "") delete cur[el.dataset.k]; else cur[el.dataset.k] = num(el.value);
    setLine(run, empId, cur);
    // move focus naturally; re-render after focus settles
    setTimeout(() => render(), 0);
  }
});
document.addEventListener("input", ev => { if (ev.target.id === "emp-search") { st.empSearch = ev.target.value; const pos = ev.target.selectionStart; render(true); const n = document.getElementById("emp-search"); n.focus(); n.setSelectionRange(pos, pos); } });
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && document.getElementById("modal-root").innerHTML) closeModal();
  if (ev.key === "Enter" && ev.target.classList && ev.target.classList.contains("cell")) { ev.preventDefault(); const cells = [...document.querySelectorAll("input.cell")]; const i = cells.indexOf(ev.target); (cells[i + 5] || cells[i + 1] || ev.target).focus(); }
});
document.addEventListener("submit", ev => ev.preventDefault());

// ---------- boot ----------
(function boot() {
  loadStore(); syncState(); st.ready = true; render(true);
  window.addEventListener("storage", e => { if (e.key === STORE_KEY) { loadStore(); syncState(); render(); } });
})();
</script>
</body>
</html>
