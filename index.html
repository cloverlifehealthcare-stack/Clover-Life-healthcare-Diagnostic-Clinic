<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clover Life Healthcare Diagnostic Clinic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F7FB; --surface:#FFFFFF; --surface-2:#EDF1F7; --surface-hover:#E4EAF3; --border:#DCE3EE;
    --ink:#101B33; --ink-2:#3C4A66; --ink-muted:#6B7A95;
    --accent:#155EEF; --accent-ink:#FFFFFF; --accent-soft:#E8F0FE;
    --teal:#0E7A6E; --teal-soft:#E1F5F2;
    --good:#12805C; --good-soft:#E1F5EC; --warn:#B54708; --warn-soft:#FDF1E3; --critical:#D92D20; --critical-soft:#FCEAE8;
    --shadow:0 1px 2px rgba(16,27,51,.06), 0 10px 28px -14px rgba(16,27,51,.16);
    --radius:10px;
    --font-display:'Manrope', ui-sans-serif, system-ui, sans-serif;
    --font-body:'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0A1120; --surface:#111A2E; --surface-2:#17223A; --surface-hover:#1E2B47; --border:#283553;
      --ink:#E7ECF7; --ink-2:#B8C4DA; --ink-muted:#8290AC;
      --accent:#5B9CFF; --accent-ink:#06152F; --accent-soft:#132A52;
      --teal:#3FD7C4; --teal-soft:#0F332F;
      --good:#3FD79A; --good-soft:#0F2E22; --warn:#F7A85B; --warn-soft:#332208; --critical:#F97066; --critical-soft:#341510;
      --shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 32px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0A1120; --surface:#111A2E; --surface-2:#17223A; --surface-hover:#1E2B47; --border:#283553;
    --ink:#E7ECF7; --ink-2:#B8C4DA; --ink-muted:#8290AC;
    --accent:#5B9CFF; --accent-ink:#06152F; --accent-soft:#132A52;
    --teal:#3FD7C4; --teal-soft:#0F332F;
    --good:#3FD79A; --good-soft:#0F2E22; --warn:#F7A85B; --warn-soft:#332208; --critical:#F97066; --critical-soft:#341510;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 32px -14px rgba(0,0,0,.6);
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:var(--font-display); text-wrap:balance; color:var(--ink); margin:0;}
  .mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  button,input,select,textarea{font:inherit; color:inherit;}
  button{cursor:pointer;}
  a{color:var(--accent);}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}
  ::selection{background:var(--accent-soft);}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

  #app{display:flex; min-height:100vh;}
  .sidebar{width:236px; flex:none; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:20px 14px; gap:4px; position:sticky; top:0; height:100vh;}
  .brand{display:flex; align-items:center; gap:10px; padding:6px 8px 18px;}
  .brand-mark{width:34px; height:34px; border-radius:9px; background:linear-gradient(155deg, var(--accent), var(--teal)); display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--font-display); font-weight:800; font-size:16px; flex:none;}
  .brand-name{font-family:var(--font-display); font-weight:800; font-size:15.5px; letter-spacing:-.01em; line-height:1.2;}
  .brand-sub{font-size:11px; color:var(--ink-muted); letter-spacing:.03em; text-transform:uppercase;}
  .nav-group-label{font-size:10.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-muted); padding:14px 10px 6px;}
  .nav-item{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px; background:none; border:none; text-align:left; width:100%; color:var(--ink-2); font-size:13.5px; font-weight:500;}
  .nav-item svg{flex:none; width:18px; height:18px; opacity:.8;}
  .nav-item:hover{background:var(--surface-2); color:var(--ink);}
  .nav-item[aria-current="page"]{background:var(--accent-soft); color:var(--accent); font-weight:600;}
  .nav-item[aria-current="page"] svg{opacity:1;}
  .nav-badge{margin-left:auto; font-size:10.5px; font-weight:600; background:var(--critical-soft); color:var(--critical); padding:1px 6px; border-radius:999px;}
  .sidebar-foot{margin-top:auto; padding-top:10px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:8px;}
  .who{display:flex; align-items:center; gap:8px; padding:6px 4px;}
  .who .avatar{width:28px; height:28px; font-size:11px;}
  .who-name{font-size:12.5px; font-weight:600; line-height:1.25;}
  .who-role{font-size:11px; color:var(--ink-muted);}
  .theme-toggle,.logout-btn{display:flex; align-items:center; gap:8px; width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); font-size:12.5px; color:var(--ink-2); font-weight:500;}
  .theme-toggle:hover,.logout-btn:hover{background:var(--surface-hover);}

  .main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{position:sticky; top:0; z-index:5; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 28px; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(8px); border-bottom:1px solid var(--border);}
  .topbar h1{font-size:20px; font-weight:800; letter-spacing:-.01em;}
  .topbar-sub{font-size:12.5px; color:var(--ink-muted); margin-top:2px;}
  .topbar-actions{display:flex; gap:10px; align-items:center;}
  .content{padding:24px 28px 60px; max-width:1180px; width:100%; margin:0 auto;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow);}
  .grid{display:grid; gap:16px;}
  .stat-grid{grid-template-columns:repeat(4, 1fr);}
  @media (max-width:900px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
  .stat-tile{padding:16px 18px; display:flex; flex-direction:column; gap:6px;}
  .stat-label{font-size:12px; color:var(--ink-muted); font-weight:500;}
  .stat-value{font-family:var(--font-display); font-size:26px; font-weight:800; letter-spacing:-.01em; font-variant-numeric:tabular-nums;}
  .stat-delta{font-size:12px; font-weight:600; display:flex; align-items:center; gap:4px;}
  .stat-delta.up{color:var(--good);} .stat-delta.down{color:var(--critical);} .stat-delta.flat{color:var(--ink-muted);}
  .section-title{font-size:15px; font-weight:700; margin-bottom:2px;}
  .section-sub{font-size:12.5px; color:var(--ink-muted); margin-bottom:14px;}
  .panel{padding:18px 20px;}
  .panel + .panel{margin-top:16px;}
  .two-col{grid-template-columns:1.3fr 1fr;}
  @media (max-width:980px){.two-col{grid-template-columns:1fr;}}

  .btn{display:inline-flex; align-items:center; gap:6px; white-space:nowrap; padding:8px 14px; border-radius:8px; border:1px solid var(--border); background:var(--surface); font-size:13px; font-weight:600; color:var(--ink-2);}
  .btn:hover{background:var(--surface-2);}
  .btn-primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-primary:disabled{opacity:.6; cursor:not-allowed;}
  .btn-ghost{border-color:transparent; background:none;}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-sm{padding:5px 9px; font-size:12px; border-radius:6px;}
  .btn-danger{color:var(--critical);}
  .btn-link{border:none; background:none; padding:0; color:var(--accent); font-weight:600; font-size:12.5px;}
  .btn-link:hover{text-decoration:underline;}

  .search-input, .field input, .field select, .field textarea{width:100%; padding:8px 11px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:13px;}
  .search-input:focus, .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent);}
  .search-wrap{position:relative; max-width:280px;}
  .search-wrap svg{position:absolute; left:9px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--ink-muted);}
  .search-wrap input{padding-left:30px;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{text-align:left; font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-muted); padding:0 14px 10px; border-bottom:1px solid var(--border);}
  tbody td{padding:12px 14px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--surface-2);}
  .table-wrap{overflow-x:auto;}
  .cell-name{font-weight:600; color:var(--ink);}
  .cell-sub{font-size:12px; color:var(--ink-muted);}
  .row-actions{display:flex; gap:6px; justify-content:flex-end;}

  .chip{display:inline-flex; align-items:center; gap:5px; padding:3px 9px 3px 7px; border-radius:999px; font-size:11.5px; font-weight:600;}
  .chip .dot{width:6px; height:6px; border-radius:50%; flex:none;}
  .chip-good{background:var(--good-soft); color:var(--good);} .chip-good .dot{background:var(--good);}
  .chip-warn{background:var(--warn-soft); color:var(--warn);} .chip-warn .dot{background:var(--warn);}
  .chip-critical{background:var(--critical-soft); color:var(--critical);} .chip-critical .dot{background:var(--critical);}
  .chip-neutral{background:var(--surface-2); color:var(--ink-2);} .chip-neutral .dot{background:var(--ink-muted);}
  .chip-accent{background:var(--accent-soft); color:var(--accent);} .chip-accent .dot{background:var(--accent);}

  .empty-state{padding:36px 20px; text-align:center; color:var(--ink-muted);}
  .empty-state svg{width:32px; height:32px; margin-bottom:10px; opacity:.6;}
  .avatar{width:32px; height:32px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; background:var(--accent-soft); color:var(--accent); font-family:var(--font-display); font-weight:700; font-size:12.5px;}
  .person-cell{display:flex; align-items:center; gap:10px;}
  .activity-item{display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--border);}
  .activity-item:last-child{border-bottom:none;}
  .activity-dot{width:8px; height:8px; border-radius:50%; margin-top:6px; flex:none; background:var(--accent);}
  .activity-text{font-size:13px;}
  .activity-time{font-size:11.5px; color:var(--ink-muted);}
  .sparkline{display:flex; align-items:flex-end; gap:5px; height:52px; margin-top:6px;}
  .spark-bar{flex:1; background:var(--accent-soft); border-radius:3px 3px 1px 1px; position:relative; min-height:4px; transition:background .15s;}
  .spark-bar.today{background:var(--accent);}
  .spark-bar:hover{background:var(--accent);}
  .spark-label{font-size:10px; color:var(--ink-muted); text-align:center; margin-top:4px;}

  .modal-overlay{position:fixed; inset:0; background:rgba(10,16,32,.5); display:flex; align-items:flex-start; justify-content:center; padding:6vh 20px; z-index:50; backdrop-filter:blur(2px);}
  .modal{background:var(--surface); border:1px solid var(--border); border-radius:14px; width:100%; max-width:460px; box-shadow:var(--shadow); max-height:88vh; overflow-y:auto;}
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 20px 4px;}
  .modal-body{padding:14px 20px 20px; display:flex; flex-direction:column; gap:13px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--ink-2); margin-bottom:5px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .field-hint{font-size:11.5px; color:var(--ink-muted); margin-top:4px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; padding-top:6px;}
  .form-error{background:var(--critical-soft); color:var(--critical); padding:8px 12px; border-radius:8px; font-size:12.5px; font-weight:500;}
  .form-notice{background:var(--accent-soft); color:var(--accent); padding:8px 12px; border-radius:8px; font-size:12.5px; font-weight:500;}

  .toast-wrap{position:fixed; bottom:20px; right:20px; z-index:80; display:flex; flex-direction:column; gap:8px;}
  .toast{background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:9px; font-size:13px; font-weight:500; box-shadow:var(--shadow); animation:toast-in .2s ease;}
  @keyframes toast-in{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  .icon-btn{width:32px; height:32px; border-radius:8px; border:1px solid var(--border); background:var(--surface); display:flex; align-items:center; justify-content:center; color:var(--ink-2);}
  .icon-btn:hover{background:var(--surface-2);}
  .icon-btn svg{width:16px; height:16px;}
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:6px;}

  .login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .login-card{width:100%; max-width:380px; padding:32px 30px; display:flex; flex-direction:column; gap:18px;}
  .login-brand{display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; margin-bottom:4px;}
  .login-brand .brand-mark{width:46px; height:46px; font-size:20px; border-radius:12px;}
  .login-brand h1{font-size:17px;}
  .login-brand p{font-size:12.5px; color:var(--ink-muted); margin:0;}
  .login-hint{font-size:11.5px; color:var(--ink-muted); text-align:center; line-height:1.5;}
  .skeleton-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; color:var(--ink-muted); font-size:13px; text-align:center; padding:24px;}
</style>
</head>
<body>
<div id="app"></div>
<script src="./config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){
"use strict";

/* ============================================================
   Icons
   ============================================================ */
const ICONS = {
  dashboard:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="11" width="8" height="10" rx="1.5"/><rect x="3" y="14" width="8" height="7" rx="1.5"/></svg>',
  patients:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c0-3.4 2.5-6 5.5-6s5.5 2.6 5.5 6"/><circle cx="17.5" cy="8.5" r="2.4"/><path d="M15.5 14c2.7 0 5 2.2 5 5.4"/></svg>',
  appts:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="4.5" width="17" height="16" rx="2"/><path d="M3.5 9.5h17M8 3v3M16 3v3"/><path d="M8 14l2 2 4-4"/></svg>',
  labs:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 3h6M10 3v6.2L5.6 17a2 2 0 001.7 3h9.4a2 2 0 001.7-3L14 9.2V3"/><path d="M8 15h8"/></svg>',
  billing:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h5M8 17h3"/></svg>',
  staff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/></svg>',
  settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 13.5a1.7 1.7 0 000-3l-1-.6a7.6 7.6 0 00-.9-2.2l.4-1.1a1.7 1.7 0 00-2.4-2.1l-1.1.5a7.6 7.6 0 00-2.2-.9l-.5-1.1a1.7 1.7 0 00-3.2 0l-.5 1.1a7.6 7.6 0 00-2.2.9l-1.1-.5a1.7 1.7 0 00-2.4 2.1l.4 1.1a7.6 7.6 0 00-.9 2.2l-1 .6a1.7 1.7 0 000 3l1 .6a7.6 7.6 0 00.9 2.2l-.4 1.1a1.7 1.7 0 002.4 2.1l1.1-.5a7.6 7.6 0 002.2.9l.5 1.1a1.7 1.7 0 003.2 0l.5-1.1a7.6 7.6 0 002.2-.9l1.1.5a1.7 1.7 0 002.4-2.1l-.4-1.1a7.6 7.6 0 00.9-2.2z"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2m2 0-1 13a1 1 0 01-1 1H8a1 1 0 01-1-1L6 7"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></svg>',
  empty:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="6" width="16" height="14" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  logout:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>',
};

/* ============================================================
   Utilities
   ============================================================ */
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function fmtDate(iso){ const d = new Date(iso + 'T00:00:00'); if (isNaN(d)) return iso; return d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}); }
function fmtDateShort(iso){ const d = new Date(iso + 'T00:00:00'); if (isNaN(d)) return iso; return d.toLocaleDateString('en-US', {month:'short', day:'numeric'}); }
function fmtMoney(n){ return '₱' + Number(n||0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function initials(name){ return String(name||'?').split(' ').filter(Boolean).slice(0,2).map(p=>p[0]).join('').toUpperCase(); }
function todayISO(offset=0){ const d = new Date(); d.setDate(d.getDate()+offset); return d.toISOString().slice(0,10); }
function relTime(iso){
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.round(diffMs/60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins} min ago`;
  const hrs = Math.round(mins/60);
  if (hrs < 24) return `${hrs} hr ago`;
  const days = Math.round(hrs/24);
  if (days === 1) return 'yesterday';
  return `${days} days ago`;
}
function toast(msg){
  const wrap = $('#toastWrap');
  if (!wrap) return;
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .25s'; el.style.opacity='0'; setTimeout(()=>el.remove(), 250); }, 2600);
}
function friendlyError(err){
  const msg = (err && err.message) || String(err);
  if (/JWT|not authenticated|401/i.test(msg)) return 'Your session ended — please log in again.';
  return msg;
}

/* ============================================================
   Supabase client
   ============================================================ */
const cfg = window.CLOVER_CONFIG || {};
let sb = null;
const hasConfig = !!(cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY && !/YOUR-/.test(cfg.SUPABASE_URL));
const libraryLoaded = typeof window.supabase !== 'undefined' && typeof window.supabase.createClient === 'function';
let configOk = hasConfig && libraryLoaded;
if (configOk){
  try{
    sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  }catch(e){
    configOk = false;
  }
}

/* ============================================================
   State
   ============================================================ */
let currentUser = null; // { id, email, name, role, dept, phone, access_role }
let state = null;
let currentView = 'dashboard';
let filters = { patients:'', appointments:'', labs:'', invoices:'', staff:'' };

async function logActivity(text){
  try{ await sb.from('activity_log').insert({ text }); }catch(e){ /* non-critical */ }
}

async function loadAllData(){
  const [clinicRes, patientsRes, apptRes, labsRes, invRes, staffRes, actRes] = await Promise.all([
    sb.from('clinic_settings').select('*').eq('id',1).single(),
    sb.from('patients').select('*').order('created_at', {ascending:false}),
    sb.from('appointments').select('*').order('appt_date', {ascending:false}),
    sb.from('lab_orders').select('*').order('ordered_date', {ascending:false}),
    sb.from('invoices').select('*').order('invoice_date', {ascending:false}),
    sb.from('profiles').select('*').order('name'),
    sb.from('activity_log').select('*').order('at', {ascending:false}).limit(8),
  ]);
  for (const r of [clinicRes, patientsRes, apptRes, labsRes, invRes, staffRes, actRes]){
    if (r.error) throw r.error;
  }
  state = {
    clinic: clinicRes.data,
    patients: patientsRes.data,
    appointments: apptRes.data,
    labOrders: labsRes.data,
    invoices: invRes.data,
    staff: staffRes.data,
    activity: actRes.data,
  };
}
async function refreshCollection(key, table, order){
  const { data, error } = await sb.from(table).select('*').order(order.col, {ascending: order.asc});
  if (error) throw error;
  state[key] = data;
}
async function refreshActivity(){
  const { data, error } = await sb.from('activity_log').select('*').order('at', {ascending:false}).limit(8);
  if (error) throw error;
  state.activity = data;
}

/* ============================================================
   Status chip helper
   ============================================================ */
function statusChip(status){
  const map = {
    'Scheduled':'accent', 'Checked-in':'warn', 'Completed':'good', 'Cancelled':'critical',
    'Pending':'warn', 'In Progress':'accent',
    'Paid':'good', 'Unpaid':'warn', 'Overdue':'critical',
  };
  const cls = map[status] || 'neutral';
  return `<span class="chip chip-${cls}"><span class="dot"></span>${esc(status)}</span>`;
}

/* ============================================================
   Modal system
   ============================================================ */
function openModal({title, fields, initial={}, onSubmit, submitLabel='Save', notice}){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="modal-head">
        <h3 style="font-size:16px;font-weight:700;">${esc(title)}</h3>
        <button class="icon-btn" data-close type="button">${ICONS.close}</button>
      </div>
      <form class="modal-body" id="modalForm">
        ${notice ? `<div class="form-notice">${esc(notice)}</div>` : ''}
        <div class="form-error" id="modalError" style="display:none;"></div>
        ${fields.map(f=>renderField(f, initial[f.key])).join('')}
        <div class="modal-actions">
          <button type="button" class="btn" data-close>Cancel</button>
          <button type="submit" class="btn btn-primary" id="modalSubmit">${esc(submitLabel)}</button>
        </div>
      </form>
    </div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
  $$('[data-close]', overlay).forEach(b => b.addEventListener('click', close));
  $('#modalForm', overlay).addEventListener('submit', async e => {
    e.preventDefault();
    const data = {};
    fields.forEach(f => {
      const el = $(`[name="${f.key}"]`, overlay);
      if (!el) return;
      data[f.key] = f.type === 'number' ? Number(el.value) : el.value;
    });
    const errBox = $('#modalError', overlay);
    const submitBtn = $('#modalSubmit', overlay);
    submitBtn.disabled = true;
    try{
      await onSubmit(data);
      close();
    }catch(err){
      errBox.textContent = friendlyError(err);
      errBox.style.display = 'block';
      submitBtn.disabled = false;
    }
  });
  setTimeout(()=>{ const first = $('.modal input, .modal select, .modal textarea', overlay); if(first) first.focus(); }, 30);
}
function renderField(f, value){
  const val = value ?? f.default ?? '';
  const label = `<label for="f_${f.key}">${esc(f.label)}</label>`;
  let input;
  if (f.type === 'select'){
    input = `<select name="${f.key}" id="f_${f.key}" ${f.disabled?'disabled':''}>${f.options.map(o=>`<option value="${esc(o.value ?? o)}" ${(o.value ?? o)===val?'selected':''}>${esc(o.label ?? o)}</option>`).join('')}</select>`;
  } else if (f.type === 'textarea'){
    input = `<textarea name="${f.key}" id="f_${f.key}" rows="3" ${f.disabled?'disabled':''}>${esc(val)}</textarea>`;
  } else {
    input = `<input name="${f.key}" id="f_${f.key}" type="${f.type||'text'}" value="${esc(val)}" ${f.required?'required':''} ${f.disabled?'disabled':''} ${f.placeholder?`placeholder="${esc(f.placeholder)}"`:''}>`;
  }
  const hint = f.hint ? `<div class="field-hint">${esc(f.hint)}</div>` : '';
  return `<div class="field">${label}${input}${hint}</div>`;
}

function renderConfigMissing(){
  const message = !hasConfig
    ? {
        title: `This app isn't connected to a Supabase project yet.`,
        hint: `Open <code>config.js</code> in this project, and replace the placeholder
          <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code> with the values from your
          Supabase project's Settings → API page, then reload this page.`,
      }
    : {
        title: `Couldn't load a required file (the Supabase library) from the network.`,
        hint: `This usually means a slow/blocked connection, an ad-blocker, or a firewall that's
          stopping <code>cdn.jsdelivr.net</code>. Try reloading the page, checking your connection,
          or trying a different network.`,
      };
  $('#app').innerHTML = `
    <div class="login-wrap">
      <div class="card login-card">
        <div class="login-brand">
          <div class="brand-mark">C</div>
          <h1>Clover Life Healthcare Diagnostic Clinic</h1>
        </div>
        <div class="form-error">${message.title}</div>
        <div class="login-hint">${message.hint}</div>
        <button class="btn btn-primary" id="retryBtn" style="justify-content:center; padding:10px;">Try again</button>
      </div>
    </div>
  `;
  const retry = $('#retryBtn');
  if (retry) retry.addEventListener('click', () => window.location.reload());
}

function renderLogin(message){
  const app = $('#app');
  app.innerHTML = `
    <div class="login-wrap">
      <div class="card login-card">
        <div class="login-brand">
          <div class="brand-mark">C</div>
          <h1>Clover Life Healthcare Diagnostic Clinic</h1>
          <p>Sign in to the clinic management system</p>
        </div>
        <div class="form-error" id="loginError" style="${message ? '' : 'display:none;'}">${esc(message||'')}</div>
        <div class="form-notice" id="loginNotice" style="display:none;"></div>
        <form id="loginForm" style="display:flex; flex-direction:column; gap:13px;">
          <div class="field"><label for="loginEmail">Email</label><input id="loginEmail" name="email" type="email" autocomplete="username" required></div>
          <div class="field"><label for="loginPass">Password</label><input id="loginPass" name="password" type="password" autocomplete="current-password" required></div>
          <button type="submit" class="btn btn-primary" id="loginSubmit" style="justify-content:center; padding:10px;">Sign in</button>
          <button type="button" class="btn-link" id="forgotBtn" style="align-self:center;">Forgot your password?</button>
        </form>
        <div class="login-hint">New staff accounts are created by your administrator in the Supabase dashboard. If you don't have a login yet, ask your practice administrator.</div>
      </div>
    </div>
    <div class="toast-wrap" id="toastWrap"></div>
  `;
  $('#loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const errBox = $('#loginError');
    const btn = $('#loginSubmit');
    const email = $('#loginEmail').value.trim();
    const password = $('#loginPass').value;
    errBox.style.display = 'none';
    btn.disabled = true;
    try{
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      await establishSession(data.session);
    }catch(err){
      errBox.textContent = friendlyError(err);
      errBox.style.display = 'block';
      btn.disabled = false;
    }
  });
  $('#forgotBtn').addEventListener('click', async () => {
    const email = $('#loginEmail').value.trim();
    const notice = $('#loginNotice');
    if (!email){ toast('Enter your email above first'); return; }
    try{
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin });
      if (error) throw error;
      notice.textContent = `If ${email} has an account, a password reset link is on its way.`;
      notice.style.display = 'block';
    }catch(err){
      toast(friendlyError(err));
    }
  });
}

    <button class="nav-item" data-nav="${n.id}" aria-current="${n.id===currentView?'page':'false'}">

}

/* ---------- Dashboard ---------- */
function renderDashboard(c){
  const today = todayISO(0);
  const todaysAppts = state.appointments.filter(a=>a.appt_date===today);
  const waiting = todaysAppts.filter(a=>a.status==='Checked-in').length;
  const pendingLabs = state.labOrders.filter(l=>l.status!=='Completed').length;
  const paidInvoices = state.invoices.filter(i=>i.status==='Paid');
  const revenue = paidInvoices.reduce((s,i)=>s+Number(i.amount||0),0);

  setHeader('Dashboard', `Here's what's happening today, ${fmtDate(today)}.`);

  const days = [];
  for (let i=6;i>=0;i--){
    const iso = todayISO(-i);
    const count = state.appointments.filter(a=>a.appt_date===iso).length;
    days.push({ iso, label: new Date(iso+'T00:00:00').toLocaleDateString('en-US',{weekday:'short'}), count });
  }
  const maxV = Math.max(...days.map(d=>d.count), 1);

  c.innerHTML = `
    <div class="grid stat-grid" style="margin-bottom:16px;">
      <div class="card stat-tile">
        <div class="stat-label">Today's appointments</div>
        <div class="stat-value">${todaysAppts.length}</div>
        <div class="stat-delta flat">${waiting} waiting now</div>
      </div>
      <div class="card stat-tile">
        <div class="stat-label">Active patients</div>
        <div class="stat-value">${state.patients.length}</div>
        <div class="stat-delta flat">on record</div>
      </div>
      <div class="card stat-tile">
        <div class="stat-label">Pending lab results</div>
        <div class="stat-value">${pendingLabs}</div>
        <div class="stat-delta ${pendingLabs>0?'down':'flat'}">${pendingLabs>0?'Needs attention':'All caught up'}</div>
      </div>
      <div class="card stat-tile">
        <div class="stat-label">Revenue collected</div>
        <div class="stat-value" style="font-size:22px;">${fmtMoney(revenue)}</div>
        <div class="stat-delta flat">${paidInvoices.length} invoice${paidInvoices.length===1?'':'s'} paid</div>
      </div>
    </div>

    <div class="grid two-col">
      <div class="card panel">
        <div class="section-title">Appointment volume — last 7 days</div>
        <div class="section-sub">Scheduled, checked-in, and completed visits</div>
        <div class="sparkline" id="sparkline"></div>
        <div style="display:flex;gap:5px;">${days.map(d=>`<div class="spark-label" style="flex:1">${d.label}</div>`).join('')}</div>

        <div style="margin-top:24px;">
          <div class="section-title">Upcoming appointments</div>
          <div class="section-sub">Today &amp; later</div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Patient</th><th>Doctor</th><th>When</th><th>Status</th></tr></thead>
              <tbody>
                ${state.appointments.filter(a=>a.appt_date>=today).sort((a,b)=>a.appt_date.localeCompare(b.appt_date)||a.appt_time.localeCompare(b.appt_time)).slice(0,5).map(a=>`
                  <tr>
                    <td class="cell-name">${esc(a.patient)}</td>
                    <td>${esc(a.doctor)}</td>
                    <td class="mono">${fmtDateShort(a.appt_date)}, ${esc(a.appt_time)}</td>
                    <td>${statusChip(a.status)}</td>
                  </tr>`).join('') || `<tr><td colspan="4" class="empty-state">No upcoming appointments</td></tr>`}
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="card panel">
        <div class="section-title">Recent activity</div>
        <div class="section-sub">Latest updates across the clinic</div>
        ${state.activity.length ? state.activity.map(a=>`
          <div class="activity-item">
            <div class="activity-dot"></div>
            <div>
              <div class="activity-text">${esc(a.text)}</div>
              <div class="activity-time">${relTime(a.at)}</div>
            </div>
          </div>`).join('') : `<div class="empty-state">${ICONS.empty}<div>No activity yet</div></div>`}
      </div>
    </div>
  `;

  const spark = $('#sparkline');
  days.forEach((d, i) => {
    const bar = document.createElement('div');
    bar.className = 'spark-bar' + (i === days.length-1 ? ' today' : '');
    bar.style.height = Math.max(6, (d.count/maxV)*100) + '%';
    bar.title = `${d.label}: ${d.count} appointment${d.count===1?'':'s'}`;
    spark.appendChild(bar);
  });
}

/* ---------- Patients ---------- */
function renderPatients(c){
  setHeader('Patients', `${state.patients.length} patients on record`,
    `<button class="btn btn-primary" id="addPatient">${ICONS.plus} Add patient</button>`);

  const q = filters.patients.toLowerCase();
  const rows = state.patients.filter(p => p.name.toLowerCase().includes(q));

  c.innerHTML = `
    <div class="card">
      <div class="panel" style="padding-bottom:12px;">
        <div class="search-wrap">${ICONS.search}<input class="search-input" id="patientSearch" placeholder="Search patients…" value="${esc(filters.patients)}"></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Patient</th><th>Age / Sex</th><th>Phone</th><th>Last visit</th><th>Notes</th><th></th></tr></thead>
          <tbody>
            ${rows.map(p=>`
              <tr>
                <td><div class="person-cell"><div class="avatar">${initials(p.name)}</div><span class="cell-name">${esc(p.name)}</span></div></td>
                <td>${p.age ?? '—'} · ${esc(p.sex||'—')}</td>
                <td class="mono">${esc(p.phone||'')}</td>
                <td class="mono">${p.last_visit ? fmtDateShort(p.last_visit) : '—'}</td>
                <td class="cell-sub">${esc(p.condition||'')}</td>
                <td><div class="row-actions">
                  <button class="icon-btn" data-edit="${p.id}">${ICONS.edit}</button>
                  <button class="icon-btn" data-del="${p.id}">${ICONS.trash}</button>
                </div></td>
              </tr>`).join('') || `<tr><td colspan="6"><div class="empty-state">${ICONS.empty}<div>No patients match your search</div></div></td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;

  $('#patientSearch').addEventListener('input', e => { filters.patients = e.target.value; renderPatients(c); });
  $('#addPatient').addEventListener('click', () => patientForm());
  $$('[data-edit]', c).forEach(b => b.addEventListener('click', () => patientForm(state.patients.find(p=>p.id===b.dataset.edit))));
  $$('[data-del]', c).forEach(b => b.addEventListener('click', async () => {
    if (!confirm('Remove this patient record? This cannot be undone.')) return;
    const { error } = await sb.from('patients').delete().eq('id', b.dataset.del);
    if (error) return toast(friendlyError(error));
    await refreshCollection('patients','patients',{col:'created_at',asc:false}); await refreshActivity();
    toast('Patient removed'); renderPatients(c);
  }));
}
function patientForm(existing){
  openModal({
    title: existing ? 'Edit patient' : 'Add patient',
    submitLabel: existing ? 'Save changes' : 'Add patient',
    initial: existing || {sex:'F', last_visit: todayISO(0)},
    fields: [
      {key:'name', label:'Full name', required:true},
      {key:'age', label:'Age', type:'number', required:true},
      {key:'sex', label:'Sex', type:'select', options:['F','M','Other']},
      {key:'phone', label:'Phone number'},
      {key:'last_visit', label:'Last visit', type:'date'},
      {key:'condition', label:'Notes / condition', type:'textarea'},
    ],
    async onSubmit(data){
      const { error } = existing
        ? await sb.from('patients').update(data).eq('id', existing.id)
        : await sb.from('patients').insert(data);
      if (error) throw error;
      await refreshCollection('patients','patients',{col:'created_at',asc:false});
      await refreshActivity();
      await logActivity(`Patient ${existing?'updated':'added'}: ${data.name} — by ${currentUser.name}`);
      await refreshActivity();
      toast(existing ? 'Patient updated' : 'Patient added');
      renderView();
    }
  });
}

function apptForm(existing){
  openModal({
    title: existing ? 'Edit appointment' : 'New appointment',
    submitLabel: existing ? 'Save changes' : 'Schedule',
    initial: existing || {appt_date: todayISO(0), appt_time:'09:00', status:'Scheduled'},
    fields: [
      {key:'patient', label:'Patient name', required:true},
      {key:'doctor', label:'Doctor', type:'select', options: state.staff.map(s=>s.name).filter(Boolean)},
      {key:'appt_date', label:'Date', type:'date', required:true},
      {key:'appt_time', label:'Time', type:'time', required:true},
      {key:'type', label:'Visit type'},
      {key:'status', label:'Status', type:'select', options:['Scheduled','Checked-in','Completed','Cancelled']},
    ],
    async onSubmit(data){
      const { error } = existing
        ? await sb.from('appointments').update(data).eq('id', existing.id)
        : await sb.from('appointments').insert(data);
      if (error) throw error;
      await refreshCollection('appointments','appointments',{col:'appt_date',asc:false});
      await logActivity(`Appointment ${existing?'updated':'booked'}: ${data.patient} (${data.appt_date} ${data.appt_time}) — by ${currentUser.name}`);
      await refreshActivity();
      toast(existing ? 'Appointment updated' : 'Appointment scheduled');
      renderView();
    }
  });
}

/* ---------- Diagnostics / Labs ---------- */
function renderLabs(c){
  setHeader('Diagnostics', `${state.labOrders.length} lab & imaging orders`,
    `<button class="btn btn-primary" id="addLab">${ICONS.plus} New order</button>`);

  const q = filters.labs.toLowerCase();
  const rows = state.labOrders
    .filter(l => l.patient.toLowerCase().includes(q) || l.test.toLowerCase().includes(q))
    .sort((a,b)=> b.ordered_date.localeCompare(a.ordered_date));

  c.innerHTML = `
    <div class="card">
      <div class="panel" style="padding-bottom:12px;">
        <div class="search-wrap">${ICONS.search}<input class="search-input" id="labSearch" placeholder="Search by patient or test…" value="${esc(filters.labs)}"></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Patient</th><th>Test / Study</th><th>Ordered</th><th>Status</th><th>Result</th><th></th></tr></thead>
          <tbody>
            ${rows.map(l=>`
              <tr>
                <td class="cell-name">${esc(l.patient)}</td>
                <td>${esc(l.test)}</td>
                <td class="mono">${fmtDateShort(l.ordered_date)}</td>
                <td>${statusChip(l.status)}</td>
                <td class="cell-sub" style="max-width:260px;">${l.result ? esc(l.result) : '<span style="color:var(--ink-muted)">—</span>'}</td>
                <td><div class="row-actions">
                  <button class="icon-btn" data-edit="${l.id}">${ICONS.edit}</button>
                  <button class="icon-btn" data-del="${l.id}">${ICONS.trash}</button>
                </div></td>
              </tr>`).join('') || `<tr><td colspan="6"><div class="empty-state">${ICONS.empty}<div>No orders found</div></div></td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;

  $('#labSearch').addEventListener('input', e => { filters.labs = e.target.value; renderLabs(c); });
  $('#addLab').addEventListener('click', () => labForm());
  $$('[data-edit]', c).forEach(b => b.addEventListener('click', () => labForm(state.labOrders.find(l=>l.id===b.dataset.edit))));
  $$('[data-del]', c).forEach(b => b.addEventListener('click', async () => {
    if (!confirm('Remove this lab/imaging order?')) return;
    const { error } = await sb.from('lab_orders').delete().eq('id', b.dataset.del);
    if (error) return toast(friendlyError(error));
    await refreshCollection('labOrders','lab_orders',{col:'ordered_date',asc:false}); await refreshActivity();
    toast('Order removed'); renderLabs(c);
  }));
}
function labForm(existing){
  openModal({
    title: existing ? 'Edit lab order' : 'New lab / imaging order',
    submitLabel: existing ? 'Save changes' : 'Create order',
    initial: existing || {ordered_date: todayISO(0), status:'Pending'},
    fields: [
      {key:'patient', label:'Patient name', required:true},
      {key:'test', label:'Test / study', required:true},
      {key:'ordered_date', label:'Order date', type:'date'},
      {key:'status', label:'Status', type:'select', options:['Pending','In Progress','Completed']},
      {key:'result', label:'Result notes', type:'textarea'},
    ],
    async onSubmit(data){
      const { error } = existing
        ? await sb.from('lab_orders').update(data).eq('id', existing.id)
        : await sb.from('lab_orders').insert(data);
      if (error) throw error;
      await refreshCollection('labOrders','lab_orders',{col:'ordered_date',asc:false});
      await logActivity(`Lab order ${existing?'updated':'added'}: ${data.test} for ${data.patient} — by ${currentUser.name}`);
      await refreshActivity();
      toast(existing ? 'Order updated' : 'Order created');

/* ---------- Billing ---------- */
function renderBilling(c){
  const total = state.invoices.reduce((s,i)=>s+Number(i.amount||0),0);
  const paid = state.invoices.filter(i=>i.status==='Paid').reduce((s,i)=>s+Number(i.amount||0),0);
  const unpaid = total - paid;

  setHeader('Billing', `${state.invoices.length} invoices on file`,
    `<button class="btn btn-primary" id="addInvoice">${ICONS.plus} New invoice</button>`);

  const q = filters.invoices.toLowerCase();
  const rows = state.invoices.filter(i=>i.patient.toLowerCase().includes(q)).sort((a,b)=>b.invoice_date.localeCompare(a.invoice_date));

  c.innerHTML = `
    <div class="grid stat-grid" style="grid-template-columns:repeat(3,1fr); margin-bottom:16px;">
      <div class="card stat-tile"><div class="stat-label">Total billed</div><div class="stat-value">${fmtMoney(total)}</div></div>
      <div class="card stat-tile"><div class="stat-label">Collected</div><div class="stat-value" style="color:var(--good)">${fmtMoney(paid)}</div></div>
      <div class="card stat-tile"><div class="stat-label">Outstanding</div><div class="stat-value" style="color:var(--warn)">${fmtMoney(unpaid)}</div></div>
    </div>
    <div class="card">
      <div class="panel" style="padding-bottom:12px;">
        <div class="search-wrap">${ICONS.search}<input class="search-input" id="invSearch" placeholder="Search by patient…" value="${esc(filters.invoices)}"></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Patient</th><th>Description</th><th>Date</th><th>Amount</th><th>Status</th><th></th></tr></thead>
          <tbody>
            ${rows.map(i=>`
              <tr>
                <td class="cell-name">${esc(i.patient)}</td>
                <td class="cell-sub">${esc(i.description)}</td>
                <td class="mono">${fmtDateShort(i.invoice_date)}</td>
                <td class="mono">${fmtMoney(i.amount)}</td>
                <td>${statusChip(i.status)}</td>
                <td><div class="row-actions">
                  ${i.status!=='Paid' ? `<button class="btn btn-sm" data-paid="${i.id}">Mark paid</button>` : ''}
                  <button class="icon-btn" data-edit="${i.id}">${ICONS.edit}</button>
                  <button class="icon-btn" data-del="${i.id}">${ICONS.trash}</button>
                </div></td>
              </tr>`).join('') || `<tr><td colspan="6"><div class="empty-state">${ICONS.empty}<div>No invoices found</div></div></td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;

  $('#invSearch').addEventListener('input', e => { filters.invoices = e.target.value; renderBilling(c); });
  $('#addInvoice').addEventListener('click', () => invoiceForm());
  $$('[data-edit]', c).forEach(b => b.addEventListener('click', () => invoiceForm(state.invoices.find(i=>i.id===b.dataset.edit))));
  $$('[data-del]', c).forEach(b => b.addEventListener('click', async () => {
    if (!confirm('Remove this invoice?')) return;
    const { error } = await sb.from('invoices').delete().eq('id', b.dataset.del);
    if (error) return toast(friendlyError(error));
    await refreshCollection('invoices','invoices',{col:'invoice_date',asc:false}); await refreshActivity();
    toast('Invoice removed'); renderBilling(c);
  }));
  $$('[data-paid]', c).forEach(b => b.addEventListener('click', async () => {
    const { error } = await sb.from('invoices').update({status:'Paid'}).eq('id', b.dataset.paid);
    if (error) return toast(friendlyError(error));
    await refreshCollection('invoices','invoices',{col:'invoice_date',asc:false});
    await logActivity(`Invoice marked paid — by ${currentUser.name}`);
    await refreshActivity();
    toast('Invoice marked paid'); renderBilling(c);
  }));
}
function invoiceForm(existing){
  openModal({
    title: existing ? 'Edit invoice' : 'New invoice',
    submitLabel: existing ? 'Save changes' : 'Create invoice',
    initial: existing || {invoice_date: todayISO(0), status:'Unpaid'},
    fields: [
      {key:'patient', label:'Patient name', required:true},
      {key:'description', label:'Description', required:true},
      {key:'amount', label:'Amount (₱)', type:'number', required:true},
      {key:'invoice_date', label:'Invoice date', type:'date'},
      {key:'status', label:'Status', type:'select', options:['Unpaid','Paid']},
    ],
    async onSubmit(data){
      const { error } = existing
        ? await sb.from('invoices').update(data).eq('id', existing.id)
        : await sb.from('invoices').insert(data);
      if (error) throw error;
      await refreshCollection('invoices','invoices',{col:'invoice_date',asc:false});
      await logActivity(`Invoice ${existing?'updated':'created'}: ${data.description} (${data.patient}) — by ${currentUser.name}`);
      await refreshActivity();
      toast(existing ? 'Invoice updated' : 'Invoice created');
      renderView();
    }
  });
}

/* ---------- Staff ---------- */
function renderStaff(c){
  const isAdmin = currentUser.access_role === 'admin';
  setHeader('Staff', `${state.staff.length} team members`, '');

  const q = filters.staff.toLowerCase();
  const rows = state.staff.filter(s=>(s.name||'').toLowerCase().includes(q));

  c.innerHTML = `
    <div class="card">
      <div class="panel" style="padding-bottom:12px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
        <div class="search-wrap">${ICONS.search}<input class="search-input" id="staffSearch" placeholder="Search staff…" value="${esc(filters.staff)}"></div>
        <div class="cell-sub">${isAdmin ? 'New logins are created in your Supabase dashboard (Authentication → Users) — edit their details here after.' : 'Only an administrator can edit staff details.'}</div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Role</th><th>Department</th><th>Access</th>${isAdmin ? '<th></th>' : ''}</tr></thead>
          <tbody>
            ${rows.map(s=>`
              <tr>
                <td><div class="person-cell"><div class="avatar">${initials(s.name)}</div><span class="cell-name">${esc(s.name || '(no name set)')}</span></div></td>
                <td>${esc(s.role||'')}</td>
                <td>${esc(s.dept||'')}</td>
                <td>${s.access_role === 'admin' ? '<span class="chip chip-accent"><span class="dot"></span>Admin</span>' : '<span class="chip chip-neutral"><span class="dot"></span>Staff</span>'}</td>
                ${isAdmin ? `<td><div class="row-actions">
                  <button class="icon-btn" data-edit="${s.id}">${ICONS.edit}</button>
                  ${s.id !== currentUser.id ? `<button class="icon-btn" data-del="${s.id}">${ICONS.trash}</button>` : ''}
                </div></td>` : ''}
              </tr>`).join('') || `<tr><td colspan="${isAdmin?5:4}"><div class="empty-state">${ICONS.empty}<div>No staff match your search</div></div></td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;

  $('#staffSearch').addEventListener('input', e => { filters.staff = e.target.value; renderStaff(c); });
  if (isAdmin){
    $$('[data-edit]', c).forEach(b => b.addEventListener('click', () => staffForm(state.staff.find(s=>s.id===b.dataset.edit))));
    $$('[data-del]', c).forEach(b => b.addEventListener('click', async () => {
      if (!confirm('Remove this staff profile? This does not delete their login — do that from the Supabase dashboard if needed.')) return;
      const { error } = await sb.from('profiles').delete().eq('id', b.dataset.del);
      if (error) return toast(friendlyError(error));
      await refreshCollection('staff','profiles',{col:'name',asc:true}); await refreshActivity();
      toast('Staff profile removed'); renderStaff(c);
    }));
  }
}
function staffForm(existing){
  openModal({
    title: 'Edit staff member',
    submitLabel: 'Save changes',
    notice: 'To create a brand-new login, use your Supabase dashboard → Authentication → Users → Add user first — it shows up here automatically.',
    initial: existing,
    fields: [
      {key:'name', label:'Full name', required:true},
      {key:'role', label:'Role / title'},
      {key:'dept', label:'Department'},
      {key:'phone', label:'Phone number'},
      {key:'access_role', label:'Access level', type:'select', options:[{value:'staff',label:'Staff'},{value:'admin',label:'Administrator'}]},
    ],
    async onSubmit(data){
      const { error } = await sb.from('profiles').update(data).eq('id', existing.id);
      if (error) throw error;
      await refreshCollection('staff','profiles',{col:'name',asc:true});
      await logActivity(`Staff profile updated: ${data.name} — by ${currentUser.name}`);
      await refreshActivity();
      if (existing.id === currentUser.id) currentUser = { ...currentUser, ...data };
      toast('Staff member updated');
      renderShell(); switchView('staff');
    }
  });
}

/* ---------- Settings ---------- */
function renderSettings(c){
  const isAdmin = currentUser.access_role === 'admin';
  setHeader('Settings', 'Clinic profile and your account');

  c.innerHTML = `
    <div class="card panel" style="max-width:520px;">
      <div class="section-title">Clinic profile</div>
      <div class="section-sub">Shown across the app</div>
      ${isAdmin ? `
        <form id="clinicForm" style="display:flex; flex-direction:column; gap:13px;">
          <div class="field"><label>Clinic name</label><input name="name" value="${esc(state.clinic.name)}"></div>
          <div class="field"><label>Tagline</label><input name="tagline" value="${esc(state.clinic.tagline)}"></div>
          <div class="field"><label>Address</label><input name="address" value="${esc(state.clinic.address)}"></div>
          <div class="field-row">
            <div class="field"><label>Phone</label><input name="phone" value="${esc(state.clinic.phone)}"></div>
            <div class="field"><label>Hours</label><input name="hours" value="${esc(state.clinic.hours)}"></div>
          </div>
          <div class="modal-actions" style="justify-content:flex-start;">
            <button type="submit" class="btn btn-primary">Save changes</button>
          </div>
        </form>
      ` : `
        <div style="display:flex; flex-direction:column; gap:8px; font-size:13px;">
          <div><span class="cell-sub">Name:</span> ${esc(state.clinic.name)}</div>
          <div><span class="cell-sub">Address:</span> ${esc(state.clinic.address)}</div>
          <div><span class="cell-sub">Phone:</span> ${esc(state.clinic.phone)}</div>
          <div><span class="cell-sub">Hours:</span> ${esc(state.clinic.hours)}</div>
        </div>
      `}
    </div>

    <div class="card panel" style="max-width:520px; margin-top:16px;">
      <div class="section-title">Your account</div>
      <div class="section-sub">Signed in as ${esc(currentUser.email)}</div>
      <form id="pwForm" style="display:flex; flex-direction:column; gap:13px;">
        <div class="form-error" id="pwError" style="display:none;"></div>
        <div class="field"><label>New password</label><input name="newPassword" type="password" required minlength="8"></div>
        <div class="modal-actions" style="justify-content:flex-start;">
          <button type="submit" class="btn btn-primary">Update password</button>
        </div>
      </form>
    </div>
  `;

  if (isAdmin){
    $('#clinicForm').addEventListener('submit', async e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const patch = Object.fromEntries(fd.entries());
      const { error } = await sb.from('clinic_settings').update(patch).eq('id', 1);
      if (error) return toast(friendlyError(error));
      state.clinic = { ...state.clinic, ...patch };
      renderShell(); switchView('settings'); toast('Clinic profile updated');
    });
  }
  $('#pwForm').addEventListener('submit', async e => {
    e.preventDefault();
    const errBox = $('#pwError');
    errBox.style.display = 'none';
    const fd = new FormData(e.target);
    try{
      const { error } = await sb.auth.updateUser({ password: fd.get('newPassword') });
      if (error) throw error;
      toast('Password updated');
      e.target.reset();
    }catch(err){
      errBox.textContent = friendlyError(err);
      errBox.style.display = 'block';
    }
  });
}

/* ============================================================
   Theme
   ============================================================ */
function toggleTheme(){
  const root = document.documentElement;
  const current = root.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = current === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  try{ localStorage.setItem('clover-theme', next); }catch(e){}
  updateThemeLabel();
}
function updateThemeLabel(){
  const root = document.documentElement;
  const explicit = root.getAttribute('data-theme');
  const isDark = explicit ? explicit === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  const label = $('#themeLabel');
  if (label) label.textContent = isDark ? 'Light mode' : 'Dark mode';
}
(function initTheme(){
  try{
    const saved = localStorage.getItem('clover-theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  }catch(e){}
})();

/* ============================================================
   Boot
   ============================================================ */
async function establishSession(session){
  if (!session){ renderLogin(); return; }
  const { data: profile, error } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
  if (error || !profile){
    renderLogin('Your login exists, but no staff profile is set up for it yet. Ask your administrator to check the Supabase dashboard.');
    return;
  }
  currentUser = { id: session.user.id, email: session.user.email, ...profile };
  try{
    await loadAllData();
    renderShell();
    renderView();
  }catch(err){
    renderLogin(friendlyError(err));
  }
}

async function boot(){
  if (!configOk){ renderConfigMissing(); return; }
  $('#app').innerHTML = `<div class="skeleton-wrap">Loading Clover Life Healthcare Diagnostic Clinic…</div>`;
  const { data } = await sb.auth.getSession();
  await establishSession(data.session);
  sb.auth.onAuthStateChange((event) => {
    if (event === 'SIGNED_OUT'){ currentUser = null; state = null; renderLogin(); }
  });
}
boot();

})();
</script>
