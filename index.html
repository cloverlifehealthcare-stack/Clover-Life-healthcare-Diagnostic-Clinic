<style>
  :root{
    --bg:#F5F7FB; --surface:#FFFFFF; --surface-2:#EDF1F7; --surface-hover:#E4EAF3; --border:#DCE3EE;
    --ink:#101B33; --ink-2:#3C4A66; --ink-muted:#6B7A95;
    --accent:#155EEF; --accent-ink:#FFFFFF; --accent-soft:#E8F0FE;
    --teal:#0E7A6E; --teal-soft:#E1F5F2;
    --good:#12805C; --good-soft:#E1F5EC; --warn:#B54708; --warn-soft:#FDF1E3; --critical:#D92D20; --critical-soft:#FCEAE8;
    --shadow:0 1px 2px rgba(16,27,51,.06), 0 10px 28px -14px rgba(16,27,51,.16);
    --radius:10px;
    --font-display:'Manrope', ui-sans-serif, system-ui, sans-serif;
    --font-body:'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0A1120; --surface:#111A2E; --surface-2:#17223A; --surface-hover:#1E2B47; --border:#283553;
      --ink:#E7ECF7; --ink-2:#B8C4DA; --ink-muted:#8290AC;
      --accent:#5B9CFF; --accent-ink:#06152F; --accent-soft:#132A52;
      --teal:#3FD7C4; --teal-soft:#0F332F;
      --good:#3FD79A; --good-soft:#0F2E22; --warn:#F7A85B; --warn-soft:#332208; --critical:#F97066; --critical-soft:#341510;
      --shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 32px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0A1120; --surface:#111A2E; --surface-2:#17223A; --surface-hover:#1E2B47; --border:#283553;
    --ink:#E7ECF7; --ink-2:#B8C4DA; --ink-muted:#8290AC;
    --accent:#5B9CFF; --accent-ink:#06152F; --accent-soft:#132A52;
    --teal:#3FD7C4; --teal-soft:#0F332F;
    --good:#3FD79A; --good-soft:#0F2E22; --warn:#F7A85B; --warn-soft:#332208; --critical:#F97066; --critical-soft:#341510;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 32px -14px rgba(0,0,0,.6);
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:var(--font-display); text-wrap:balance; color:var(--ink); margin:0;}
  .mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  button,input,select,textarea{font:inherit; color:inherit;}
  button{cursor:pointer;}
  a{color:var(--accent);}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}
  ::selection{background:var(--accent-soft);}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

  #app{display:flex; min-height:100vh;}
  .sidebar{width:236px; flex:none; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:20px 14px; gap:4px; position:sticky; top:0; height:100vh;}

  .brand-name{font-family:var(--font-display); font-weight:800; font-size:15.5px; letter-spacing:-.01em; line-height:1.2;}
  .brand-sub{font-size:11px; color:var(--ink-muted); letter-spacing:.03em; text-transform:uppercase;}
  .nav-group-label{font-size:10.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-muted); padding:14px 10px 6px;}
  .nav-item{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px; background:none; border:none; text-align:left; width:100%; color:var(--ink-2); font-size:13.5px; font-weight:500;}
  .nav-item svg{flex:none; width:18px; height:18px; opacity:.8;}
  .nav-item:hover{background:var(--surface-2); color:var(--ink);}
  .nav-item[aria-current="page"]{background:var(--accent-soft); color:var(--accent); font-weight:600;}
  .nav-item[aria-current="page"] svg{opacity:1;}
  .nav-badge{margin-left:auto; font-size:10.5px; font-weight:600; background:var(--critical-soft); color:var(--critical); padding:1px 6px; border-radius:999px;}
  .sidebar-foot{margin-top:auto; padding-top:10px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:8px;}
  .who{display:flex; align-items:center; gap:8px; padding:6px 4px;}
  .who .avatar{width:28px; height:28px; font-size:11px;}
  .who-name{font-size:12.5px; font-weight:600; line-height:1.25;}
  .who-role{font-size:11px; color:var(--ink-muted);}
  .theme-toggle,.logout-btn{display:flex; align-items:center; gap:8px; width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); font-size:12.5px; color:var(--ink-2); font-weight:500;}
  .theme-toggle:hover,.logout-btn:hover{background:var(--surface-hover);}

  .main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{position:sticky; top:0; z-index:5; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 28px; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(8px); border-bottom:1px solid var(--border);}
  .topbar h1{font-size:20px; font-weight:800; letter-spacing:-.01em;}
  .topbar-sub{font-size:12.5px; color:var(--ink-muted); margin-top:2px;}
  .topbar-actions{display:flex; gap:10px; align-items:center;}
  .content{padding:24px 28px 60px; max-width:1180px; width:100%; margin:0 auto;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow);}
  .grid{display:grid; gap:16px;}
  .stat-grid{grid-template-columns:repeat(4, 1fr);}
  @media (max-width:900px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
  .stat-tile{padding:16px 18px; display:flex; flex-direction:column; gap:6px;}
  .stat-label{font-size:12px; color:var(--ink-muted); font-weight:500;}
  .stat-value{font-family:var(--font-display); font-size:26px; font-weight:800; letter-spacing:-.01em; font-variant-numeric:tabular-nums;}
  .stat-delta{font-size:12px; font-weight:600; display:flex; align-items:center; gap:4px;}
  .stat-delta.up{color:var(--good);} .stat-delta.down{color:var(--critical);} .stat-delta.flat{color:var(--ink-muted);}
  .section-title{font-size:15px; font-weight:700; margin-bottom:2px;}
  .section-sub{font-size:12.5px; color:var(--ink-muted); margin-bottom:14px;}
  .panel{padding:18px 20px;}
  .panel + .panel{margin-top:16px;}
  .two-col{grid-template-columns:1.3fr 1fr;}
  @media (max-width:980px){.two-col{grid-template-columns:1fr;}}

  .btn{display:inline-flex; align-items:center; gap:6px; white-space:nowrap; padding:8px 14px; border-radius:8px; border:1px solid var(--border); background:var(--surface); font-size:13px; font-weight:600; color:var(--ink-2);}
  .btn:hover{background:var(--surface-2);}
  .btn-primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-primary:disabled{opacity:.6; cursor:not-allowed;}
  .btn-ghost{border-color:transparent; background:none;}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-sm{padding:5px 9px; font-size:12px; border-radius:6px;}
  .btn-danger{color:var(--critical);}
  .btn-link{border:none; background:none; padding:0; color:var(--accent); font-weight:600; font-size:12.5px;}
  .btn-link:hover{text-decoration:underline;}

  .search-input, .field input, .field select, .field textarea{width:100%; padding:8px 11px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:13px;}
  .search-input:focus, .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent);}
  .search-wrap{position:relative; max-width:280px;}
  .search-wrap svg{position:absolute; left:9px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--ink-muted);}
  .search-wrap input{padding-left:30px;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{text-align:left; font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-muted); padding:0 14px 10px; border-bottom:1px solid var(--border);}
  tbody td{padding:12px 14px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--surface-2);}
  .table-wrap{overflow-x:auto;}
  .cell-name{font-weight:600; color:var(--ink);}
  .cell-sub{font-size:12px; color:var(--ink-muted);}
  .row-actions{display:flex; gap:6px; justify-content:flex-end;}

  .chip{display:inline-flex; align-items:center; gap:5px; padding:3px 9px 3px 7px; border-radius:999px; font-size:11.5px; font-weight:600;}
  .chip .dot{width:6px; height:6px; border-radius:50%; flex:none;}
  .chip-good{background:var(--good-soft); color:var(--good);} .chip-good .dot{background:var(--good);}
  .chip-warn{background:var(--warn-soft); color:var(--warn);} .chip-warn .dot{background:var(--warn);}
  .chip-critical{background:var(--critical-soft); color:var(--critical);} .chip-critical .dot{background:var(--critical);}
  .pkg-list{margin:6px 0 0; padding-left:16px; font-size:12px; color:var(--ink-muted); line-height:1.55;} .pkg-list li{margin:0;}
  .chip-neutral{background:var(--surface-2); color:var(--ink-2);} .chip-neutral .dot{background:var(--ink-muted);}
  .chip-accent{background:var(--accent-soft); color:var(--accent);} .chip-accent .dot{background:var(--accent);}

  .empty-state{padding:36px 20px; text-align:center; color:var(--ink-muted);}
  .empty-state svg{width:32px; height:32px; margin-bottom:10px; opacity:.6;}
  .avatar{width:32px; height:32px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; background:var(--accent-soft); color:var(--accent); font-family:var(--font-display); font-weight:700; font-size:12.5px;}
  .person-cell{display:flex; align-items:center; gap:10px;}
  .activity-item{display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--border);}
  .activity-item:last-child{border-bottom:none;}
  .activity-dot{width:8px; height:8px; border-radius:50%; margin-top:6px; flex:none; background:var(--accent);}
  .activity-text{font-size:13px;}
  .activity-time{font-size:11.5px; color:var(--ink-muted);}
  .sparkline{display:flex; align-items:flex-end; gap:5px; height:52px; margin-top:6px;}
  .spark-bar{flex:1; background:var(--accent-soft); border-radius:3px 3px 1px 1px; position:relative; min-height:4px; transition:background .15s;}
  .spark-bar.today{background:var(--accent);}
  .spark-bar:hover{background:var(--accent);}
  .spark-label{font-size:10px; color:var(--ink-muted); text-align:center; margin-top:4px;}

  /* Financial page — BIR-style books of accounts */
  .fin-formula{display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap;}
  .fin-box{flex:1 1 170px; min-width:150px;}
  .fin-box .stat-label{margin-bottom:5px;}
  .fin-amount{padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink); font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:15px; font-weight:600;}
  .fin-op{flex:none; font-family:var(--font-display); font-size:20px; font-weight:700; color:var(--ink-muted); padding-bottom:8px;}

/* ============================================================
   Utilities
   ============================================================ */
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function fmtDate(iso){ const d = new Date(iso + 'T00:00:00'); if (isNaN(d)) return iso; return d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}); }
function fmtDateShort(iso){ const d = new Date(iso + 'T00:00:00'); if (isNaN(d)) return iso; return d.toLocaleDateString('en-US', {month:'short', day:'numeric'}); }
function fmtMoney(n){ return '₱' + Number(n||0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function initials(name){ return String(name||'?').split(' ').filter(Boolean).slice(0,2).map(p=>p[0]).join('').toUpperCase(); }
function todayISO(offset=0){ const d = new Date(); d.setDate(d.getDate()+offset); return d.toISOString().slice(0,10); }
function ageFromDob(dob){
  if (!dob) return null;
  const d = new Date(dob + 'T00:00:00');
  if (isNaN(d)) return null;
  const now = new Date();
  let age = now.getFullYear() - d.getFullYear();
  const m = now.getMonth() - d.getMonth();
  if (m < 0 || (m === 0 && now.getDate() < d.getDate())) age--;
  return age;
}
function relTime(iso){
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.round(diffMs/60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins} min ago`;
  const hrs = Math.round(mins/60);
  if (hrs < 24) return `${hrs} hr ago`;
  const days = Math.round(hrs/24);
  if (days === 1) return 'yesterday';
  return `${days} days ago`;
}
function toast(msg){
  const wrap = $('#toastWrap');
  if (!wrap) return;
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .25s'; el.style.opacity='0'; setTimeout(()=>el.remove(), 250); }, 2600);
}
function friendlyError(err){
  const msg = (err && err.message) || String(err);
  if (/JWT|not authenticated|401/i.test(msg)) return 'Your session ended — please log in again.';
  return msg;
}

async function loadAllData(){
  const [clinicRes, patientsRes, apptRes, labsRes, invRes, staffRes, actRes, inventoryRes, financialsRes, shiftsRes, followUpsRes, consultationsRes, requestsRes, portalRes, expensesRes, disbRes, priceRes] = await Promise.all([
    sb.from('clinic_settings').select('*').eq('id',1).single(),
    sb.from('patients').select('*').order('created_at', {ascending:false}),
    sb.from('appointments').select('*').order('appt_date', {ascending:false}),
    sb.from('lab_orders').select('*').order('ordered_date', {ascending:false}),
    sb.from('invoices').select('*').order('invoice_date', {ascending:false}),
    sb.from('profiles').select('*').order('name'),
    sb.from('activity_log').select('*').order('at', {ascending:false}).limit(8),
    sb.from('inventory_items').select('*').order('name', {ascending:true}),
    sb.from('financial_entries').select('*').order('entry_date', {ascending:false}),
    sb.from('staff_shifts').select('*').order('shift_date', {ascending:false}),
    sb.from('follow_ups').select('*').order('due_date', {ascending:true}),
    sb.from('consultations').select('*').order('created_at', {ascending:false}),
    sb.from('appointment_requests').select('*').order('created_at', {ascending:false}),
    sb.from('patient_profiles').select('*').order('created_at', {ascending:false}),
    sb.from('expenses').select('*').order('expense_date', {ascending:false}),
    sb.from('cash_disbursements').select('*').order('disb_date', {ascending:false}),
    sb.from('service_prices').select('*').order('sort', {ascending:true}),
  ]);
  for (const r of [clinicRes, patientsRes, apptRes, labsRes, invRes, staffRes, actRes]){
    if (r.error) throw r.error;
  }
  state = {
    clinic: clinicRes.data,
    patients: patientsRes.data,
    appointments: apptRes.data,
    labOrders: labsRes.data,
    invoices: invRes.data,
    staff: staffRes.data,
    activity: actRes.data,
    // Tolerated as empty if supabase/add-dashboard-features.sql,
    // supabase/add-consultations.sql, supabase/add-patient-portal.sql or
    // supabase/add-financial-reports.sql hasn't been run yet on this
    // project — the rest of the app still works either way.
    inventory: inventoryRes.error ? [] : inventoryRes.data,
    // Legacy free-form financial entries. The Financial page and the
    // dashboard's financial summary now read from invoices/expenses/
    // cash_disbursements instead, but the table and its rows are kept
    // intact and still loaded here so nothing that was recorded is lost.
    financials: financialsRes.error ? [] : financialsRes.data,
    shifts: shiftsRes.error ? [] : shiftsRes.data,
    followUps: followUpsRes.error ? [] : followUpsRes.data,
    consultations: consultationsRes.error ? [] : consultationsRes.data,
    requests: requestsRes.error ? [] : requestsRes.data,
    patientProfiles: portalRes.error ? [] : portalRes.data,
    expenses: expensesRes.error ? [] : expensesRes.data,
    cashDisbursements: disbRes.error ? [] : disbRes.data,
    // Admin-editable price list; null until add-service-prices.sql has been run (built-in list is used meanwhile).
    servicePrices: priceRes.error ? null : priceRes.data,
  };
  applyServicePrices();
}
async function refreshCollection(key, table, order){
  const { data, error } = await sb.from(table).select('*').order(order.col, {ascending: order.asc});
  if (error) throw error;
  state[key] = data;
}
async function refreshActivity(){
  const { data, error } = await sb.from('activity_log').select('*').order('at', {ascending:false}).limit(8);
  if (error) throw error;
  state.activity = data;
}

    'Paid':'good', 'Unpaid':'warn', 'Overdue':'critical',

  const cls = map[status] || 'neutral';
  return `<span class="chip chip-${cls}"><span class="dot"></span>${esc(status)}</span>`;
}

// Keep the built-in list as a fallback; admin-edited prices (service_prices table) replace it when present.
const STATIC_CATALOG = TEST_CATALOG.slice();
function applyServicePrices(){
  const rows = state && Array.isArray(state.servicePrices) ? state.servicePrices : [];
  if (!rows.length){ TEST_CATALOG.splice(0, TEST_CATALOG.length, ...STATIC_CATALOG); return; }
  const list = rows.filter(r => r.active).sort((a,b) => (a.sort||0) - (b.sort||0))
    .map((r,id) => ({id, cat:r.category, group:r.grp, name:r.name, price:Number(r.price), incl:r.inclusions||''}));
  TEST_CATALOG.splice(0, TEST_CATALOG.length, ...list);
}

// Proper clinic name: fixes missing spaces / odd capitalisation of the saved name (e.g. "DiagnosticClinic").
const CLINIC_NAME = 'Clover Life Healthcare Diagnostic Clinic';
function clinicName(){
  const saved = String((state && state.clinic && state.clinic.name) || '').trim();
  if (!saved) return CLINIC_NAME;
  return saved.replace(/\s+/g, '').toLowerCase().startsWith('cloverlifehealthcare') ? CLINIC_NAME : saved;
}
// Patient code lookup by patient name (the app links records to patients by name).
function codeFor(name){
  const n = String(name||'').trim().toLowerCase();
  const p = state && state.patients ? state.patients.find(x => String(x.name||'').trim().toLowerCase() === n) : null;
  return p && p.patient_code ? p.patient_code : '';
}
// Patient name cell: name plus small patient code underneath (same code shown in Consultations).
function nameWithCode(name){

}
// Patient email (by name) so the whole team can see where emailed results go.
function emailFor(name){
  const n = String(name||'').trim().toLowerCase();
  const p = state && state.patients ? state.patients.find(x => String(x.name||'').trim().toLowerCase() === n) : null;
  return p && p.email ? String(p.email).trim() : '';
}
function phoneFor(name){
  const n = String(name||'').trim().toLowerCase();
  const p = state && state.patients ? state.patients.find(x => String(x.name||'').trim().toLowerCase() === n) : null;
  return p && p.phone ? String(p.phone).trim() : '';
}
function nameWithEmail(name){

  return nameWithCode(name) + (ph ? `<div class="cell-sub mono">📱 ${esc(ph)}</div>` : '') + (em ? `<div class="cell-sub" style="word-break:break-all;">✉ ${esc(em)}</div>` : '');

// Pay-first rule: a test order linked to an unpaid invoice cannot be started.
function labInvoice(l){
  if (!l || !l.invoice_id || !state.invoices) return null;
  return state.invoices.find(i => String(i.id) === String(l.invoice_id)) || null;
}
function labAwaitingPayment(l){ const inv = labInvoice(l); return !!inv && inv.status !== 'Paid'; }
// Creates ONE Unpaid invoice for a visit (consultation fee and/or tests). Returns the new invoice id, or null.
async function createVisitInvoice(patientName, items){
  const total = items.reduce((s,i) => s + Number(i.price||0), 0);
  if (!items.length || total <= 0) return null;
  const description = items.map(i => i.label).join(' + ');
  const { data, error } = await sb.from('invoices')
    .insert({patient:patientName, payor:patientName, description, amount:total, discount:0, method:null, invoice_date:todayISO(0), status:'Unpaid'})
    .select('id').single();
  if (error) throw error;
  await refreshCollection('invoices','invoices',{col:'invoice_date',asc:false});
  return data && data.id != null ? data.id : null;
}
// Price of an order from the clinic price list (null when the test isn't on the list).
function priceFor(l){
  const nm = String(l.test||'').trim().toLowerCase();
  const src = (state && Array.isArray(state.servicePrices) && state.servicePrices.length)
    ? state.servicePrices.map(r => ({name:r.name, cat:r.category, price:r.price})) : TEST_CATALOG;
  const t = src.find(x => x.name.toLowerCase() === nm && x.cat === (l.category || 'Laboratory'))
         || src.find(x => x.name.toLowerCase() === nm);
  return t ? Number(t.price) : null;
}
function isBilled(l){ return !!labInvoice(l); }
// Orders for a patient that have a listed price but no invoice yet.
function unbilledOrders(patientName){
  const nm = String(patientName||'').trim().toLowerCase();
  return (state.labOrders||[]).filter(l => String(l.patient||'').trim().toLowerCase() === nm && !isBilled(l) && priceFor(l) != null);
}
// Creates one Unpaid invoice for the given orders and links them to it.
async function billOrders(patientName, orders){
  const items = [{label:'Tests: ' + orders.map(o => o.test).join(', '), price: orders.reduce((a,o) => a + priceFor(o), 0)}];
  const invId = await createVisitInvoice(patientName, items);
  if (invId == null) throw new Error('Could not create the invoice.');
  const { error } = await sb.from('lab_orders').update({invoice_id: invId}).in('id', orders.map(o => o.id));
  if (error) throw error;
  await refreshCollection('labOrders','lab_orders',{col:'ordered_date',asc:false});
  await logActivity(`Billed ${orders.length} procedure${orders.length>1?'s':''} for ${patientName} (${fmtMoney(items[0].price)}) — by ${currentUser.name}`);
  await refreshActivity();
  renderNav();
  return items[0].price;
}
// Which diagnostic categories the signed-in staff member may order.
function allowedDiagCategories(){
  const access = currentUser.access_role === 'admin' ? 'all' : (currentUser.diagnostics_access || 'all');
  return access === 'laboratory' ? ['Laboratory'] : access === 'radiology' ? ['Radiology'] : ['Laboratory','Radiology'];
}
// Single-test dropdown used on the Diagnostics order form.
// Digital signature upload: the picture is shrunk and stored as a small PNG data string.
function wireSignature(overlay){
  const file = $('#sigFile', overlay); if (!file) return;
  const hidden = $('#f_signature', overlay), prev = $('#sigPreview', overlay);
  const show = v => { prev.innerHTML = v ? `<img src="${v}" alt="signature" style="max-height:60px; background:#fff; border-radius:4px; padding:2px;">` : ''; };
  file.addEventListener('change', () => {
    const f = file.files && file.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, 400 / img.width, 160 / img.height);
        const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        hidden.value = c.toDataURL('image/png'); show(hidden.value);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(f);
  });
  $('#sigClear', overlay).addEventListener('click', () => { hidden.value = ''; file.value = ''; show(''); });
}
function wireTestPicker(overlay){
  const pick = $('#testPick', overlay); if (!pick) return;
  const other = $('#testOther', overlay), hidden = $('#f_test', overlay), hint = $('#testPickHint', overlay);
  const catEl = $('[name="category"]', overlay);
  const cat = () => catEl ? catEl.value : (window.__modalCategory || 'Laboratory');
  function fill(value){
    const c = cat();
    const groups = {};
    TEST_CATALOG.filter(t => t.cat === c).forEach(t => { (groups[t.group] = groups[t.group] || []).push(t); });
    let html = '<option value="">— Select a test / study —</option>';
    Object.keys(groups).forEach(g => {
      html += `<optgroup label="${esc(g)}">` + groups[g].map(t => `<option value="${t.id}">${esc(t.name)} — ${fmtMoney(t.price)}</option>`).join('') + '</optgroup>';
    });
    html += '<option value="__other">Other (type your own)…</option>';
    pick.innerHTML = html;
    other.style.display = 'none'; other.value = ''; hint.textContent = '';
    hidden.value = '';
    if (!value) return;
    const match = TEST_CATALOG.find(t => t.cat === c && t.name === value);
    if (match){ pick.value = String(match.id); hidden.value = match.name; showHint(match); }
    else { pick.value = '__other'; other.style.display = ''; other.value = value; hidden.value = value; }
  }
  function showHint(t){ hint.textContent = fmtMoney(t.price) + (t.incl ? ' · Includes: ' + t.incl : ''); }
  pick.addEventListener('change', () => {
    if (pick.value === '__other'){ other.style.display = ''; other.focus(); hidden.value = other.value.trim(); hint.textContent = ''; }
    else if (pick.value === ''){ other.style.display = 'none'; hidden.value = ''; hint.textContent = ''; }
    else { const t = TEST_CATALOG[Number(pick.value)]; other.style.display = 'none'; hidden.value = t.name; showHint(t); }
  });
  other.addEventListener('input', () => { hidden.value = other.value.trim(); });
  if (catEl) catEl.addEventListener('change', () => {
    // keep a typed "other" entry; clear a catalog selection that belongs to the old category
    fill(pick.value === '__other' ? other.value.trim() : '');
  });
  fill(hidden.value);
}
// Multi-select checklist used on the patient form.
function wireTestChecklist(overlay){
  const box = $('#tcBox', overlay); if (!box) return;
  const search = $('#tcSearch', overlay), count = $('#tcCount', overlay), hidden = $('#f_tests', overlay);
  const boxes = $$('input[type=checkbox]', box);
  const tabBtns = $$('[data-tc-tab]', overlay);
  let tab = tabBtns.length ? tabBtns[0].dataset.tcTab : null;
  function update(){
    const ids = boxes.filter(b => b.checked).map(b => Number(b.value));
    hidden.value = JSON.stringify(ids);
    tabBtns.forEach(b => {
      const n = boxes.filter(x => x.checked && TEST_CATALOG[Number(x.value)].cat === b.dataset.tcTab).length;
      const el = $('.tc-tab-n', b); if (el) el.textContent = n ? ` · ${n}` : '';
    });
    const total = ids.reduce((s,id) => s + Number(TEST_CATALOG[id].price||0), 0);
    count.textContent = ids.length ? `${ids.length} selected · ${fmtMoney(total)} (one Unpaid invoice in Billing; tests wait in Laboratory / Radiology until paid)` : 'None selected';
  }
  boxes.forEach(b => b.addEventListener('change', update));
  function applyFilter(){
    const q = search.value.trim().toLowerCase();
    let any = false;
    $$('[data-tc-group]', box).forEach(g => {
      let vis = 0;
      const inTab = !tab || g.dataset.cat === tab;
      $$('.tc-item', g).forEach(it => { const show = inTab && (!q || it.dataset.search.includes(q)); it.style.display = show ? '' : 'none'; if (show) vis++; });
      g.style.display = vis ? '' : 'none';
      if (vis) any = true;
    });
    $('#tcEmpty', box).style.display = any ? 'none' : '';
  }
  tabBtns.forEach(b => b.addEventListener('click', () => {
    tab = b.dataset.tcTab;
    tabBtns.forEach(x => x.classList.toggle('btn-primary', x === b));
    search.placeholder = tab === 'Radiology' ? 'Search X-ray, ultrasound, ECG (e.g. chest PA, abdomen)…' : 'Search laboratory tests (e.g. CBC, urinalysis)…';
    applyFilter();
  }));
  search.addEventListener('input', applyFilter);
  search.addEventListener('keydown', e => { if (e.key === 'Enter') e.preventDefault(); });
  update();
  applyFilter();
}

function openModal({title, fields, initial={}, onSubmit, submitLabel='Save', notice, onOpen, readOnly=false}){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="modal-head">
        <h3 style="font-size:16px;font-weight:700;">${esc(title)}</h3>
        <button class="icon-btn" data-close type="button">${ICONS.close}</button>
      </div>
      <form class="modal-body" id="modalForm">
        ${notice ? `<div class="form-notice">${esc(notice)}</div>` : ''}
        <div class="form-error" id="modalError" style="display:none;"></div>
        ${fields.map((f,i)=>(f.section && f.section!==fields[i-1]?.section ? `<div class="section-title" style="margin:${i===0?'0':'18px'} 0 4px;">${esc(f.section)}</div>` : '') + renderField(f, initial[f.key])).join('')}
        <div class="modal-actions">
          <button type="button" class="btn" data-close>Cancel</button>
          <button type="submit" class="btn btn-primary" id="modalSubmit">${esc(submitLabel)}</button>
        </div>
      </form>
    </div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  if (readOnly){
    // View-only: every field is locked and there is no Save button.
    overlay.querySelectorAll('input, select, textarea').forEach(el => { el.disabled = true; });
    const sb = overlay.querySelector('#modalSubmit'); if (sb) sb.remove();
    const cancel = overlay.querySelector('.modal-actions [data-close]'); if (cancel) cancel.textContent = 'Close';
    const note = document.createElement('div'); note.className = 'form-notice'; note.textContent = 'View only — only a doctor or administrator can change a consultation.';
    const body = overlay.querySelector('#modalForm'); body.insertBefore(note, body.firstChild);
  }
  wireTestPicker(overlay);
  wireTestChecklist(overlay);
  wireSignature(overlay);
  if (onOpen) onOpen(overlay);
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
  $$('[data-close]', overlay).forEach(b => b.addEventListener('click', close));
  $('#modalForm', overlay).addEventListener('submit', async e => {
    e.preventDefault();
    const data = {};
    fields.forEach(f => {
      const el = $(`[name="${f.key}"]`, overlay);
      if (!el) return;
      data[f.key] = f.type === 'number' ? (f.nullable && el.value === '' ? '' : Number(el.value)) : el.value;
    });
    const errBox = $('#modalError', overlay);
    const submitBtn = $('#modalSubmit', overlay);
    submitBtn.disabled = true;
    try{
      await onSubmit(data);
      close();
    }catch(err){
      errBox.textContent = friendlyError(err);
      errBox.style.display = 'block';
      submitBtn.disabled = false;
    }
  });
  setTimeout(()=>{ const first = $('.modal input, .modal select, .modal textarea', overlay); if(first) first.focus(); }, 30);
}
function renderField(f, value){
  const val = value ?? f.default ?? '';
  const label = `<label for="f_${f.key}">${esc(f.label)}</label>`;
  let input;
  if (f.type === 'testpicker'){
    input = `<select id="testPick"></select><input type="text" id="testOther" placeholder="Type the test / study name" style="display:none; margin-top:6px;"><input type="hidden" name="${f.key}" id="f_${f.key}" value="${esc(val)}"><div class="field-hint" id="testPickHint"></div>`;
  } else if (f.type === 'testchecklist'){
    const groups = [];
    (f.items||[]).forEach(t => { let g = groups.find(x => x.name === t.cat + ' — ' + t.group); if (!g){ g = {name: t.cat + ' — ' + t.group, items: []}; groups.push(g); } g.items.push(t); });
    const tcCats = Array.from(new Set((f.items||[]).map(t => t.cat)));
    const tabs = tcCats.length > 1 ? `<div class="tc-tabs" id="tcTabs">${tcCats.map((c,i) => `<button type="button" class="btn btn-sm${i===0?' btn-primary':''}" data-tc-tab="${esc(c)}">${c === 'Radiology' ? 'Radiology (X-ray, Ultrasound, ECG)' : esc(c)}<span class="tc-tab-n"></span></button>`).join('')}</div>` : '';
    input = `${tabs}<input type="search" id="tcSearch" placeholder="Search tests (e.g. CBC, urinalysis, chest x-ray)…" autocomplete="off">
      <div class="tc-box" id="tcBox">${groups.map(g => `<div data-tc-group data-cat="${esc(g.items[0].cat)}"><div class="tc-group">${esc(g.name)}</div>${g.items.map(t => `<label class="tc-item" data-search="${esc((t.name + ' ' + t.group + ' ' + t.cat + ' ' + (t.incl||'')).toLowerCase())}"><input type="checkbox" value="${t.id}"><span class="tc-name">${esc(t.name)}${t.incl ? `<span class="tc-incl">${esc(t.incl)}</span>` : ''}</span><span class="tc-price">${fmtMoney(t.price)}</span></label>`).join('')}</div>`).join('')}<div class="tc-empty" id="tcEmpty" style="display:none;">No tests match your search.</div></div>
      <div class="field-hint" id="tcCount">None selected</div>
      <input type="hidden" name="${f.key}" id="f_${f.key}" value="[]">`;
  } else if (f.type === 'select'){
    input = `<select name="${f.key}" id="f_${f.key}" ${f.disabled?'disabled':''}>${f.options.map(o=>`<option value="${esc(o.value ?? o)}" ${(o.value ?? o)===val?'selected':''}>${esc(o.label ?? o)}</option>`).join('')}</select>`;
  } else if (f.type === 'signature'){
    input = `<input type="file" accept="image/*" id="sigFile">
      <div id="sigPreview" style="margin-top:8px;">${val ? `<img src="${esc(val)}" alt="signature" style="max-height:60px; background:#fff; border-radius:4px; padding:2px;">` : ''}</div>
      <input type="hidden" name="${f.key}" id="f_${f.key}" value="${esc(val)}">
      <button type="button" class="btn btn-sm" id="sigClear" style="margin-top:6px;">Remove signature</button>`;
  } else if (f.type === 'textarea'){
    input = `<textarea name="${f.key}" id="f_${f.key}" rows="3" ${f.disabled?'disabled':''}>${esc(val)}</textarea>`;
  } else {
    input = `<input name="${f.key}" id="f_${f.key}" type="${f.type||'text'}" autocomplete="off" ${f.type==='number'?'step="any"':''} value="${esc(val)}" ${f.required?'required':''} ${f.disabled?'disabled':''} ${f.placeholder?`placeholder="${esc(f.placeholder)}"`:''}>`;
  }
  if (f.datalist){
    input = input.replace('<input ', `<input list="dl_${f.key}" autocomplete="off" `) + `<datalist id="dl_${f.key}">${f.datalist.map(v => `<option value="${esc(v)}"></option>`).join('')}</datalist>`;
  }
  const hint = f.hint ? `<div class="field-hint">${esc(f.hint)}</div>` : '';
  return `<div class="field">${label}${input}${hint}</div>`;
}

// Which lab_orders rows this signed-in staff member is allowed to see.
// Admins and anyone left on the 'all' default (every staff account, until an
// admin restricts one) see everything; a staff member set to "Laboratory
// only" or "Radiology only" on the Staff page sees just that category —
// consistently across the nav badge, the Dashboard tiles, and the
// Diagnostics page itself. This is a display restriction for internal staff
// organization, the same level of enforcement the admin-only Management
// pages already use — it is not a security boundary against an untrusted
// outside actor the way the patient-portal RLS policies are.
// Which department an order belongs to. A test that is on the price list as Radiology (X-ray, ultrasound, ECG)
// always goes to Radiology, even if it was saved without a category; anything else uses its saved category.
function orderDept(l){
  const nm = String(l.test||'').trim().toLowerCase();
  const t = TEST_CATALOG.find(x => x.name.toLowerCase() === nm);
  if (t && t.cat === 'Radiology') return 'Radiology';
  if (l.category === 'Radiology') return 'Radiology';
  if (t && t.cat) return t.cat;
  return l.category || 'Laboratory';
}
function visibleLabOrders(){
  const access = currentUser.diagnostics_access || 'all';
  if (currentUser.access_role === 'admin' || access === 'all') return state.labOrders;
  const want = access === 'laboratory' ? 'Laboratory' : 'Radiology';
  return state.labOrders.filter(l => orderDept(l) === want);
}
// Consultations are for doctors only. Administrators always have access; any other
// staff member needs "Doctor" (or Physician / MD / Dr.) in their Role / title on the Staff page.
function isDoctorRole(role){
  return /\b(doctor|physician|doc|md|m\.d\.|dr\.?|surgeon|pediatrician|cardiologist|radiologist|pathologist)\b/i.test(String(role||''));
}
// Billing is for administrators and the Clinic Supervisor only (role / title containing "supervisor").
function canBill(){
  if (!currentUser) return false;
  if (currentUser.access_role === 'admin') return true;
  return /supervisor/i.test(String(currentUser.role||''));
}
function canConsult(){
  if (!currentUser) return false;
  if (currentUser.access_role === 'admin') return true;
  return isDoctorRole(currentUser.role);
}
// Names offered in the "Doctor" dropdowns: staff whose role says Doctor (or an administrator),
// plus the name already saved on the record being edited.
function doctorNames(keep){
  const names = state.staff.filter(s => s.name && (s.access_role === 'admin' || isDoctorRole(s.role))).map(s => s.name);
  if (keep && !names.includes(keep)) names.push(keep);
  return names;
}
function renderNav(){
  const pendingLabs = visibleLabOrders().filter(l=>l.status!=='Completed').length;
  const pendingRequests = state.requests.filter(r=>r.status==='pending').length;
  const isAdmin = currentUser.access_role === 'admin';
  const nav = $('#navList');
  const badgeFor = (id) => {
    const n = id==='labs' ? visibleLabOrders().filter(l => orderDept(l)==='Laboratory' && l.status!=='Completed').length : id==='radiology' ? visibleLabOrders().filter(l => orderDept(l)==='Radiology' && l.status!=='Completed').length : id==='requests' ? pendingRequests : 0;
    return n ? `<span class="nav-badge">${n}</span>` : '';
  };
  const renderItems = (items) => items.map(n => `
    <button class="nav-item" data-nav="${n.id}" aria-current="${n.id===currentView?'page':'false'}">
      ${ICONS[n.icon]}<span>${n.label}</span>
      ${badgeFor(n.id)}
    </button>`).join('');
  const workspaceItems = NAV.filter(n => !n.adminOnly && (!n.doctorOnly || canConsult()) && (!n.billingOnly || canBill()) && (!n.dept || allowedDiagCategories().includes(n.dept)));
  const mgmtItems = NAV.filter(n => n.adminOnly);
  nav.innerHTML = renderItems(workspaceItems)
    + (isAdmin && mgmtItems.length ? `<div class="nav-group-label">Management</div>${renderItems(mgmtItems)}` : '');
  $$('[data-nav]', nav).forEach(btn => btn.addEventListener('click', () => switchView(btn.dataset.nav)));
}

function switchView(id){
  const navItem = NAV.find(n=>n.id===id);
  if (navItem && navItem.adminOnly && currentUser.access_role !== 'admin') return;
  if (navItem && navItem.billingOnly && !canBill()) return;
  if (navItem && navItem.dept && !allowedDiagCategories().includes(navItem.dept)) return;
  currentView = id;
  if (id === 'consultations') consultationsSelectedPatient = null; // always land on the patient picker
  renderNav();
  renderView();
}

function setHeader(title, sub, actionsHtml=''){
  $('#pageTitle').textContent = title;
  $('#pageSub').textContent = sub;
  $('#pageActions').innerHTML = actionsHtml;
}

// Laboratory-only (Medtech) and Radiology-only (Radtech) staff cannot register patients or book appointments.
function canRegister(){ return !!currentUser && (currentUser.access_role === 'admin' || (currentUser.diagnostics_access || 'all') === 'all'); }
function canDelete(){ return !!currentUser && currentUser.access_role === 'admin'; }
function renderView(){
  const c = $('#content');
  if (currentView === 'billing' && !canBill()) currentView = 'dashboard';
  if (currentView === 'labs' && !allowedDiagCategories().includes('Laboratory')) currentView = allowedDiagCategories().includes('Radiology') ? 'radiology' : 'dashboard';
  if (currentView === 'radiology' && !allowedDiagCategories().includes('Radiology')) currentView = 'dashboard';
  const renderers = {
    dashboard: renderDashboard, patients: renderPatients, consultations: renderConsultations, appointments: renderAppointments,
    requests: renderRequests, labs: c => renderLabs(c, 'Laboratory'), radiology: c => renderLabs(c, 'Radiology'), billing: renderBilling, prices: renderPriceList, staff: renderStaff, settings: renderSettings,
    inventory: renderInventory, financial: renderFinancial, scheduling: renderScheduling, reminders: renderReminders,
  };
  c.innerHTML = '';
  renderers[currentView](c);
  if (!canDelete()) c.querySelectorAll('[data-del],[data-pdel],[data-inv-del],[data-exp-del],[data-disb-del]').forEach(e => e.remove());
}

// Every test listed inside a package's "includes" text (split on commas outside brackets).
function packageParts(incl){
  const parts = []; let depth = 0, cur = '';
  String(incl||'').split('').forEach(ch => {
    if (ch === '(') depth++; if (ch === ')') depth = Math.max(0, depth-1);
    if (ch === ',' && depth === 0){ parts.push(cur); cur = ''; } else cur += ch;
  });
  parts.push(cur);
  const out = [], seen = new Set();
  parts.map(x => x.trim()).filter(Boolean).forEach(x => {
    // "Lipid Profile (...) BUA" is two tests written without a comma
    const m = x.match(/^(.*\))\s+([A-Za-z].*)$/);
    (m ? [m[1], m[2]] : [x]).forEach(y => { const k = y.toLowerCase(); if (!seen.has(k)){ seen.add(k); out.push(y); } });
  });
  return out;
}
const RADIO_PART_RE = /x-?ray|\becg\b|ultra\s?sound|\busg\b/i;
// X-ray / ultrasound / ECG items inside a package.
function packageRadiologyParts(incl){ return packageParts(incl).filter(x => RADIO_PART_RE.test(x)); }
// The tests inside the package an order was placed for (empty for a single test).
function orderPackageParts(l){
  const nm = String(l.test||'').trim().toLowerCase();
  const t = TEST_CATALOG.find(x => x.name.toLowerCase() === nm);
  return t && t.cat === 'Laboratory' && t.incl ? packageParts(t.incl) : [];
}
const CIVIL_STATUS_OPTIONS = [{value:'',label:'— Select —'},'Single','Married','Widowed','Separated','Annulled','Live-in / Common-law'];
const NATIONALITY_OPTIONS = ['Filipino','American','Chinese','Japanese','Korean','Indian','British','Australian','Canadian','Others'];
const GOV_ID_OPTIONS = [{value:'',label:'— None / not presented —'},'PWD ID','Senior Citizen ID','PhilHealth ID','SSS ID','UMID','Driver’s License','Passport','Postal ID','PRC ID','Voter’s ID','National ID (PhilSys)','TIN ID','Company ID','Student ID','Others'];
function patientForm(existing){
  let initial = existing || {sex:'F', last_visit: todayISO(0), nationality:'Filipino'};
  if (existing && !existing.first_name && existing.name){
    const parts = existing.name.trim().split(/\s+/);
    initial = {...existing, first_name: parts[0]||'', last_name: parts.slice(1).join(' ')||''};
  }
  // Nationality is a dropdown; anything not on the list shows as "Others" with the typed value in the box below it.
  if (existing){
    const nat = existing.nationality || '';
    initial = {...initial, nationality: !nat ? '' : NATIONALITY_OPTIONS.includes(nat) ? nat : 'Others', nationality_other: !nat || NATIONALITY_OPTIONS.includes(nat) ? '' : nat};
  }
  openModal({
    title: existing ? 'Edit patient' : 'New patient',
    onOpen(overlay){
      const sel = overlay.querySelector('[name="nationality"]'), oth = overlay.querySelector('[name="nationality_other"]');
      if (!sel || !oth) return;
      const box = oth.closest('.field');
      const sync = () => { box.style.display = sel.value === 'Others' ? '' : 'none'; };
      sel.addEventListener('change', sync); sync();
    },
    submitLabel: existing ? 'Save changes' : 'Register patient',
    initial,
    fields: [
      {key:'patient_code', label:'Patient code', disabled:true, default:'', hint: existing ? 'Assigned automatically — cannot be changed.' : 'Assigned automatically when you save.', section:'Demographics'},
      {key:'first_name', label:'First name', required:true},
      {key:'middle_name', label:'Middle name'},
      {key:'last_name', label:'Last name', required:true},
      {key:'dob', label:'Date of birth', type:'date', required:true},
      {key:'sex', label:'Sex', type:'select', options:['F','M','Other']},
      {key:'civil_status', label:'Civil status', type:'select', options: CIVIL_STATUS_OPTIONS},
      {key:'nationality', label:'Nationality', type:'select', options:[{value:'',label:'— Select —'}, ...NATIONALITY_OPTIONS]},
      {key:'nationality_other', label:'Others: specify nationality'},
      {key:'occupation', label:'Occupation', placeholder:'e.g. Teacher, Driver, Student, Unemployed'},
      {key:'phone', label:'Mobile No.'},
      {key:'email', label:'Email', type:'email'},
      {key:'address', label:'Address'},
      {key:'government_id', label:'Government ID', type:'select', options: GOV_ID_OPTIONS, section:'Identification',
       hint:'Includes PWD and Senior Citizen IDs (these patients get a 20% discount at the cashier).'},
      {key:'id_number', label:'ID No.'},
      {key:'temperature_c', label:'Temperature (°C)', type:'number', nullable:true, section:'Vital signs'},
      {key:'blood_pressure', label:'Blood pressure (mmHg)', placeholder:'120/80'},
      {key:'heart_rate', label:'Pulse / heart rate (bpm)', type:'number', nullable:true},
      {key:'respiratory_rate', label:'Respiratory rate (breaths/min)', type:'number', nullable:true},
      {key:'oxygen_saturation', label:'Oxygen saturation SpO2 (%)', type:'number', nullable:true},
      {key:'height_cm', label:'Height (cm)', type:'number', nullable:true},
      {key:'weight_kg', label:'Weight (kg)', type:'number', nullable:true, hint:'These vital signs are copied into the patient’s next consultation automatically.'},
      {key:'known_drug_allergy', label:'Known Drug Allergy (KDA) — specify', section:'Clinical history', placeholder:'e.g. Penicillin, Sulfa. Write "None" if there is none.'},
      {key:'emergency_contact_name', label:'Name', section:'Emergency contact'},
      {key:'emergency_contact_phone', label:'Number'},
      {key:'emergency_contact_relationship', label:'Relationship'},
      {key:'attending_physician', label:'Attending physician', section:'Visit details', datalist: doctorNames(existing && existing.attending_physician),
       hint:'Type the doctor’s name, or pick one from the list (doctors on your Staff page).'},
      {key:'last_visit', label:'Last visit', type:'date'},
      {key:'condition', label:'Reason for visit', type:'textarea'},
      {key:'consult_type', label:'Consultation', type:'select', section:'Consultation (optional)',
       options:[{value:'',label:'— None —'},{value:'onsite',label:'On-site consultation — ₱600.00'},{value:'referred',label:'Referred by a doctor — no fee'}],
       hint:'On-site adds ₱600 to the patient’s invoice in Billing. Referred by a doctor is free.'},
      {key:'tests', type:'testchecklist', label:'Tests / services requested', section:'Tests requested (optional)',
       items: TEST_CATALOG.filter(t => allowedDiagCategories().includes(t.cat)),
       hint:'Tick the tests this patient needs. An Unpaid invoice is created in Billing; the tests wait in the Laboratory / Radiology page until the patient has paid.'},
      {key:'fasting_status', label:'Pre-test instruction: fasting (10 to 12 hours) — for FBS & Lipid Profile', type:'select', options: FASTING_OPTIONS,
       hint:'Did the patient fast 10 to 12 hours? Only applied to FBS and Lipid Profile (including packages that contain them).'},
      {key:'result_delivery', label:'RESULT SENDOUT', type:'select', options: RESULT_DELIVERY_OPTIONS,
       hint:'Printed out, or to email to the client (type the patient’s own email in the Email box above). Applies to the tests ticked here.'},
    ],
    async onSubmit(rawData){
      const data = {...rawData};
      let pickedIds = [];
      try { pickedIds = JSON.parse(data.tests || '[]'); } catch(_) {}
      delete data.tests; // not a column on `patients`
      if (data.nationality === 'Others') data.nationality = String(data.nationality_other||'').trim() || 'Others';
      delete data.nationality_other; // typed value is stored in nationality
      if (!existing) ['civil_status','nationality','occupation','government_id','id_number','known_drug_allergy'].forEach(k => { if (!data[k]) delete data[k]; });
      const resultDelivery = data.result_delivery || '';
      const fastingStatus = data.fasting_status || '';
      delete data.fasting_status; // belongs to the lab orders, not the patient row
      delete data.result_delivery; // belongs to the lab orders, not the patient row
      delete data.patient_code; // assigned by the database, never edited here
      const consultType = data.consult_type || '';
      delete data.consult_type; // not a column on `patients`
      data.name = [data.first_name, data.middle_name, data.last_name].filter(Boolean).join(' ').trim();
      if (!data.name) throw new Error('First and last name are required.');
      data.age = ageFromDob(data.dob);
      ['height_cm','weight_kg','temperature_c','heart_rate','respiratory_rate','oxygen_saturation'].forEach(k => { if (data[k]==='' || isNaN(data[k])) data[k] = null; });
      if (!existing) ['temperature_c','blood_pressure','heart_rate','respiratory_rate','oxygen_saturation','attending_physician'].forEach(k => { if (data[k]===null || data[k]==='') delete data[k]; });
      const { error } = existing
        ? await sb.from('patients').update(data).eq('id', existing.id)
        : await sb.from('patients').insert(data);
      if (error) throw error;
      await refreshCollection('patients','patients',{col:'created_at',asc:false});
      // One Unpaid invoice for the visit: on-site consultation (₱600) + any ticked tests.
      // Referred-by-a-doctor consultations are free and add nothing to the bill.
      let consultMsg = '', ordered = 0, orderFailed = false, invoiceTotal = 0, invoiceFailed = false;
      const allowed = allowedDiagCategories();
      const picked = pickedIds.map(id => TEST_CATALOG[id]).filter(t => t && allowed.includes(t.cat));
      const items = [];
      if (consultType === 'onsite') items.push({label:"Doctor's consultation (on-site)", price:600});
      if (consultType === 'referred') consultMsg = 'consultation: referred by a doctor (no fee)';
      if (picked.length) items.push({label:'Tests: ' + picked.map(t => t.name).join(', '), price: picked.reduce((a,t) => a + Number(t.price||0), 0)});
      // Packages that include an X-ray, ultrasound or ECG also send a request (no extra charge) to Radiology.
      const radiologyParts = [];
      picked.filter(t => t.cat === 'Laboratory').forEach(pkg => {
        packageRadiologyParts(pkg.incl).forEach(part => radiologyParts.push(`${part} (in ${pkg.name.replace(/\s*\(.*\)\s*$/, '')})`));
      });
      let invId = null;
      if (items.length){
        try { invId = await createVisitInvoice(data.name, items); invoiceTotal = items.reduce((a,i) => a + i.price, 0); }
        catch(e){ invoiceFailed = true; console.error(e); }
      }
      if (consultType === 'onsite' && !invoiceFailed) consultMsg = 'consultation ₱600';
      if (picked.length && !invoiceFailed){
        const rows = picked.concat([]).map(t => { const r = {patient:data.name, test:t.name, category:t.cat, ordered_date:todayISO(0), status:'Pending'}; if (invId != null) r.invoice_id = invId; if (resultDelivery) r.result_delivery = resultDelivery; if (t.cat === 'Laboratory' && /\(stat\)/i.test(t.name)) r.priority = 'Stat'; if (fastingStatus && needsFasting(t.name)) r.fasting_status = fastingStatus; return r; });
        radiologyParts.forEach(name => {
          const r = {patient:data.name, test:name, category:'Radiology', ordered_date:todayISO(0), status:'Pending'};
          if (invId != null) r.invoice_id = invId;
          if (resultDelivery) r.result_delivery = resultDelivery;
          rows.push(r);
        });
        const { error: orderErr } = await sb.from('lab_orders').insert(rows);
        if (orderErr){ orderFailed = true; console.error(orderErr); }
        else {
          ordered = rows.length;
          await refreshCollection('labOrders','lab_orders',{col:'ordered_date',asc:false});
          renderNav();
        }
      }
      await refreshActivity();
      await logActivity(`Patient ${existing?'updated':'added'}: ${data.name}${ordered?` (${ordered} test order${ordered>1?'s':''} created)`:''}${invoiceTotal && !invoiceFailed?` [invoice ${fmtMoney(invoiceTotal)} created]`:''}${consultMsg?` [${consultMsg}]`:''} — by ${currentUser.name}`);
      await refreshActivity();
      const newCode = existing ? '' : (state.patients.find(p => p.name === data.name) || {}).patient_code;
      toast((existing ? 'Patient updated' : 'Patient registered') + (newCode ? ` (${newCode})` : '')
        + (invoiceTotal && !invoiceFailed ? ` · Unpaid invoice ${fmtMoney(invoiceTotal)} created in Billing — patient pays first` : '')
        + (ordered ? ` · ${ordered} test order${ordered>1?'s':''} waiting in Laboratory / Radiology` : '')
        + (consultMsg && !invoiceTotal ? ` · ${consultMsg}` : '')
        + (invoiceFailed ? ' — but the invoice could not be saved, so no test orders were created; please add them in Billing/Diagnostics' : '')
        + (orderFailed ? ' — but the test orders could not be saved; please add them in Diagnostics' : ''));
      renderView();
    }
  });
}

/* ---------- Consultations ---------- */
// "Last, First" display name — falls back to splitting the legacy `name`
// field the same way patientForm does when structured name fields are blank.
function patientDisplayName(p){
  let first = p.first_name, last = p.last_name;
  if (!first && !last && p.name){
    const parts = p.name.trim().split(/\s+/);
    first = parts[0] || '';
    last = parts.slice(1).join(' ') || '';
  }
  if (last || first) return `${last||''}${last && first ? ', ' : ''}${first||''}`;
  return p.name || '—';
}
// Today's non-cancelled appointment for a patient, matched by name (the
// same free-text link appointments already use elsewhere in this app).
function todaysApptFor(patientName){
  const today = todayISO(0);
  return state.appointments.find(a => a.patient === patientName && a.appt_date === today && a.status !== 'Cancelled');
}

function renderConsultations(c){
  if (consultationsSelectedPatient){
    const patient = state.patients.find(p=>p.id===consultationsSelectedPatient);
    if (!patient){ consultationsSelectedPatient = null; renderConsultationsPicker(c); return; }
    renderConsultationDetail(c, patient);
    return;
  }
  renderConsultationsPicker(c);
}

                <td>${appt ? `<span class="chip chip-accent"><span class="dot"></span>Scheduled ${esc(appt.appt_time)}</span>` : `<span class="cell-sub">Walk-in</span>`}</td>
              </tr>`;
            }).join('') || `<tr><td colspan="4"><div class="empty-state">${ICONS.empty}<div>No patients match your search</div></div></td></tr>`}

function renderConsultationDetail(c, patient){
  const today = todayISO(0);
  setHeader('Consultations', `${patientDisplayName(patient)} — patient record`);

  const history = state.consultations.filter(cn=>cn.patient_id===patient.id)
    .sort((a,b)=> (b.visit_date||'').localeCompare(a.visit_date||'') || (b.created_at||'').localeCompare(a.created_at||''));

    actionHandler = () => consultationForm(patient, inProgressToday);

    actionLabel = 'Start scheduled consultation';
    actionHandler = () => consultationForm(patient, null, {visit_type:'scheduled', appointment_id: todaysAppt.id});
  } else {
    actionLabel = 'Start walk-in consultation';
    actionHandler = () => consultationForm(patient, null, {visit_type:'walk-in', appointment_id: null});

      <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap;">
        <div>

          <div class="section-sub" style="margin-bottom:0;">${esc(patient.patient_code||'—')} · ${age ?? '—'} yrs · ${esc(patient.sex||'—')}${patient.phone ? ' · 📱 ' + esc(patient.phone) : ''}${patient.email ? ' · ✉ ' + esc(patient.email) : ''}</div>
          ${vitalsLine(patient) ? `<div class="cell-sub" style="margin-top:8px; max-width:620px;"><strong style="color:var(--ink-2);">Vital signs:</strong> ${esc(vitalsLine(patient))}</div>` : ''}
          ${patient.chief_complaint ? `<div class="cell-sub" style="margin-top:8px; max-width:520px;"><strong style="color:var(--ink-2);">Chief complaint:</strong> ${esc(patient.chief_complaint)}</div>` : ''}
        </div>
        ${canConsult() ? `<button class="btn btn-primary" id="consultAction">${ICONS.plus} ${esc(actionLabel)}</button>` : '<span class="chip chip-neutral"><span class="dot"></span>View only</span>'}
      </div>
    </div>
    <div class="card">
      <div class="panel" style="padding-bottom:8px;">
        <div class="section-title">Consultation history</div>
        <div class="section-sub">${history.length} past consultation${history.length===1?'':'s'}</div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Doctor</th><th>Diagnosis</th><th>Status</th><th></th></tr></thead>
          <tbody>
            ${history.map(cn=>`
              <tr>
                <td class="mono">${cn.visit_date ? fmtDateShort(cn.visit_date) : '—'}</td>
                <td>${esc(cn.doctor||'—')}</td>
                <td class="cell-sub">${esc(cn.diagnosis||'—')}</td>
                <td>${cn.status==='completed' ? '<span class="chip chip-good"><span class="dot"></span>Completed</span>' : '<span class="chip chip-accent"><span class="dot"></span>In progress</span>'}</td>
                <td><div class="row-actions"><button class="btn btn-sm" data-view="${cn.id}">${canConsult() ? 'View / Edit' : 'View'}</button></div></td>
              </tr>`).join('') || `<tr><td colspan="5"><div class="empty-state">${ICONS.empty}<div>No consultations recorded yet</div></div></td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;

  $('#backToConsultations').addEventListener('click', () => { consultationsSelectedPatient = null; renderView(); });
  if ($('#consultAction')) $('#consultAction').addEventListener('click', actionHandler);
  $$('[data-view]', c).forEach(b => b.addEventListener('click', () => consultationForm(patient, history.find(cn=>cn.id===b.dataset.view))));
}

function vitalsLine(p){
  const parts = [];
  if (p.temperature_c != null && p.temperature_c !== '') parts.push(`Temp ${p.temperature_c} °C`);
  if (p.blood_pressure) parts.push(`BP ${p.blood_pressure}`);
  if (p.heart_rate != null && p.heart_rate !== '') parts.push(`Pulse ${p.heart_rate} bpm`);
  if (p.respiratory_rate != null && p.respiratory_rate !== '') parts.push(`RR ${p.respiratory_rate}/min`);
  if (p.oxygen_saturation != null && p.oxygen_saturation !== '') parts.push(`SpO2 ${p.oxygen_saturation}%`);
  if (p.height_cm != null && p.height_cm !== '') parts.push(`Height ${p.height_cm} cm`);
  if (p.weight_kg != null && p.weight_kg !== '') parts.push(`Weight ${p.weight_kg} kg`);
  return parts.join(' · ');
}
function consultationForm(patient, existing, presets){
  // Only doctors and administrators can create or change a consultation; everyone else can just view one.
  const viewOnly = !canConsult();
  if (viewOnly && !existing) return;
  const initial = existing || {visit_type: presets?.visit_type || 'walk-in', status:'in-progress', doctor: patient.attending_physician || '',
    // Vital signs taken at registration are copied in so nobody has to type them twice.
    temperature_c: patient.temperature_c ?? '', blood_pressure: patient.blood_pressure ?? '', heart_rate: patient.heart_rate ?? '',
    respiratory_rate: patient.respiratory_rate ?? '', oxygen_saturation: patient.oxygen_saturation ?? '',
    weight_kg: patient.weight_kg ?? '', height_cm: patient.height_cm ?? '',
    chief_complaint: patient.chief_complaint ?? '', medical_history: patient.medical_history ?? ''};
  openModal({
    readOnly: viewOnly,
    title: existing ? `Consultation — ${fmtDateShort(existing.visit_date)}` : `New consultation — ${patientDisplayName(patient)}`,
    submitLabel: existing ? 'Save changes' : 'Save consultation',
    initial,
    fields: [
      {key:'visit_type', label:'Visit type', type:'select', options:[{value:'walk-in',label:'Walk-in'},{value:'scheduled',label:'Scheduled'}], section:'Visit'},
      {key:'doctor', label:'Doctor', type:'select', options: doctorNames(existing ? existing.doctor : patient.attending_physician)},
      {key:'status', label:'Status', type:'select', options:[{value:'in-progress',label:'In progress'},{value:'completed',label:'Completed'}]},
      {key:'temperature_c', label:'Temperature (°C)', type:'number', nullable:true, section:'Vitals'},
      {key:'blood_pressure', label:'Blood pressure', placeholder:'120/80'},
      {key:'heart_rate', label:'Pulse / heart rate (bpm)', type:'number', nullable:true},
      {key:'respiratory_rate', label:'Respiratory rate (breaths/min)', type:'number', nullable:true},
      {key:'oxygen_saturation', label:'Oxygen saturation SpO2 (%)', type:'number', nullable:true},
      {key:'height_cm', label:'Height (cm)', type:'number', nullable:true},
      {key:'weight_kg', label:'Weight (kg)', type:'number', nullable:true},
      {key:'chief_complaint', label:'Chief complaint', type:'textarea', section:'Assessment'},
      {key:'medical_history', label:'Medical history', type:'textarea', placeholder:'Known conditions, allergies, ongoing medications…'},
      {key:'diagnosis', label:'Diagnosis', type:'textarea'},
      {key:'treatment_plan', label:'Treatment plan', type:'textarea'},
      {key:'prescription', label:'Prescription', type:'textarea'},
      {key:'follow_up_date', label:'Follow-up date (optional)', type:'date'},
      {key:'notes', label:'Additional notes', type:'textarea'},
    ],
    async onSubmit(rawData){
      const data = {...rawData};
      ['temperature_c','heart_rate','weight_kg','respiratory_rate','oxygen_saturation','height_cm'].forEach(k => { if (data[k]==='' || isNaN(data[k])) data[k] = null; });
      if (!existing) ['respiratory_rate','oxygen_saturation','height_cm'].forEach(k => { if (data[k]===null) delete data[k]; });
      if (!existing) ['chief_complaint','medical_history'].forEach(k => { if (!data[k]) delete data[k]; });
      if (existing){
        const { error } = await sb.from('consultations').update(data).eq('id', existing.id);
        if (error) throw error;
      } else {
        const insertData = {...data, patient_id: patient.id, patient_name: patient.name, visit_date: todayISO(0), appointment_id: presets?.appointment_id || null};
        const { error } = await sb.from('consultations').insert(insertData);
        if (error) throw error;
      }
      // Keep the patient record current (Patients list and the consultation header read from it).
      try {
        const upd = {};
        ['chief_complaint','medical_history'].forEach(k => { if (data[k] != null && data[k] !== '') upd[k] = data[k]; });
        if (Object.keys(upd).length){ await sb.from('patients').update(upd).eq('id', patient.id); await refreshCollection('patients','patients',{col:'created_at',asc:false}); }
      } catch(e){ console.error(e); }
      if (data.follow_up_date){
        const note = 'Follow-up from consultation' + (data.diagnosis ? ': ' + data.diagnosis : '');
        await sb.from('follow_ups').insert({ patient: patient.name, due_date: data.follow_up_date, note, status:'pending' });
      }
      await refreshCollection('consultations','consultations',{col:'created_at',asc:false});
      await logActivity(`Consultation ${existing?'updated':'started'} for ${patient.name} — by ${currentUser.name}`);
      await refreshActivity();
      toast(existing ? 'Consultation updated' : 'Consultation started');
      renderView();
    }
  });
}

    if (!confirm('Remove this appointment?')) return;
    const { error } = await sb.from('appointments').delete().eq('id', b.dataset.del);
    if (error) return toast(friendlyError(error));
    await refreshCollection('appointments','appointments',{col:'appt_date',asc:false}); await refreshActivity();
    toast('Appointment removed'); renderAppointments(c);
  }));

function apptForm(existing){
  openModal({
    title: existing ? 'Edit appointment' : 'New appointment',
    submitLabel: existing ? 'Save changes' : 'Schedule',
    initial: existing || {appt_date: todayISO(0), appt_time:'09:00', status:'Scheduled'},
    fields: [
      {key:'patient', label:'Patient name', required:true, datalist: state.patients.map(p => p.name),
       hint: existing ? '' : 'Pick a registered patient from the list. A new name is registered automatically and gets a patient code.'},
      ...(existing ? [] : [{key:'new_phone', label:'Contact number (only for a new patient)'}]),
      {key:'doctor', label:'Doctor', type:'select', options: doctorNames(existing && existing.doctor)},
      {key:'appt_date', label:'Date', type:'date', required:true},
      {key:'appt_time', label:'Time', type:'time', required:true},
      {key:'type', label:'Visit type'},
      {key:'status', label:'Status', type:'select', options:['Scheduled','Checked-in','Completed','Cancelled']},
    ],
    async onSubmit(data){
      const newPhone = String(data.new_phone || '').trim();
      delete data.new_phone; // not a column on `appointments`
      data.patient = String(data.patient || '').trim().replace(/\s+/g, ' ');
      let registeredCode = '', registeredNew = false;
      if (!existing){
        // A brand-new name is registered as a patient so the database assigns a patient code.
        const nm = data.patient.toLowerCase();
        let pat = state.patients.find(p => String(p.name||'').trim().toLowerCase() === nm);
        if (!pat){
          const parts = data.patient.split(' ');
          const { data: created, error: pErr } = await sb.from('patients').insert({
            name: data.patient, first_name: parts[0] || data.patient, last_name: parts.slice(1).join(' ') || null,
            phone: newPhone || null, last_visit: data.appt_date || todayISO(0),
          }).select().single();
          if (pErr) throw pErr;
          pat = created; registeredNew = true;
          await refreshCollection('patients','patients',{col:'created_at',asc:false});
          pat = state.patients.find(p => p.id === created.id) || created;
        }
        data.patient = pat.name || data.patient; // use the registered spelling so codes always match
        registeredCode = pat.patient_code || '';
      }
      const { error } = existing
        ? await sb.from('appointments').update(data).eq('id', existing.id)
        : await sb.from('appointments').insert(data);
      if (error) throw error;
      await refreshCollection('appointments','appointments',{col:'appt_date',asc:false});
      await logActivity(`Appointment ${existing?'updated':'booked'}: ${data.patient} (${data.appt_date} ${data.appt_time}) — by ${currentUser.name}`);
      await refreshActivity();
      toast(existing ? 'Appointment updated' : ('Appointment scheduled' + (registeredNew ? ` · new patient registered${registeredCode ? ' (' + registeredCode + ')' : ''}` : (registeredCode ? ` · patient code ${registeredCode}` : ''))));
      renderView();
    }
  });
}

/* ---------- Requests (patient portal booking requests) ---------- */
// Patients book through the separate patient portal app, which writes to
// `appointment_requests`. Nothing there is an appointment until a staff
// member confirms it here — that's what creates the real `appointments` row
// and links the portal account to a patient chart.
function requestStatusChip(status){
  const map = {pending:'warn', confirmed:'good', declined:'neutral'};
  const label = {pending:'Pending', confirmed:'Confirmed', declined:'Declined'}[status] || status;
  return `<span class="chip chip-${map[status]||'neutral'}"><span class="dot"></span>${esc(label)}</span>`;
}
// The patient chart a portal account is already linked to, if any.
function linkedPatientFor(userId){
  const link = (state.patientProfiles||[]).find(pp => pp.id === userId);
  if (!link || !link.patient_id) return null;
  return state.patients.find(p => p.id === link.patient_id) || null;
}

function renderRequests(c){

  const q = filters.requests.toLowerCase();
  const rows = state.requests
    .filter(r => (r.patient_name||'').toLowerCase().includes(q)
              || (r.contact_email||'').toLowerCase().includes(q)
              || (r.reason||'').toLowerCase().includes(q)
              || (r.service_type||'').toLowerCase().includes(q)
              || (r.physician_preference||'').toLowerCase().includes(q))
    .sort((a,b)=> (a.status==='pending'?0:1) - (b.status==='pending'?0:1)
              || (b.created_at||'').localeCompare(a.created_at||''));

  c.innerHTML = `
    <div class="card">
      <div class="panel" style="padding-bottom:12px;">
        <div class="search-wrap">${ICONS.search}<input class="search-input" id="requestSearch" placeholder="Search by name, email, reason, or service…" value="${esc(filters.requests)}"></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Requested by</th><th>Contact</th><th>Preferred</th><th>Asked for</th><th>Chart</th><th>Status</th><th></th></tr></thead>
          <tbody>
            ${rows.map(r=>{
              const linked = linkedPatientFor(r.patient_user_id);
              // Both preference fields are optional, and older requests
              // predate them entirely — show a line only when there's one.
              const askedFor = [
                r.service_type ? `<div style="color:var(--ink-2); font-weight:600;">${esc(r.service_type)}</div>` : '',
                r.reason ? esc(r.reason) : '',
                r.physician_preference ? `<div style="margin-top:3px;">Preferred doctor: ${esc(r.physician_preference)}</div>` : '',
              ].filter(Boolean).join('') || '—';
              return `
              <tr>
                <td><div class="person-cell"><div class="avatar">${initials(r.patient_name)}</div><span class="cell-name">${esc(r.patient_name)}</span></div></td>
                <td class="cell-sub">${esc(r.contact_phone||'')}${r.contact_phone && r.contact_email ? '<br>' : ''}${esc(r.contact_email||'')}</td>
                <td class="mono">${r.preferred_date ? fmtDateShort(r.preferred_date) : '—'}${r.preferred_time ? ', '+esc(r.preferred_time) : ''}</td>
                <td class="cell-sub">${askedFor}</td>
                <td class="cell-sub">${linked ? esc(linked.patient_code || linked.name) : '<span style="opacity:.7">Not linked yet</span>'}</td>
                <td>${requestStatusChip(r.status)}${r.staff_notes ? `<div class="cell-sub" style="margin-top:4px;">${esc(r.staff_notes)}</div>` : ''}</td>
                <td><div class="row-actions">
                  ${r.status==='pending' ? `
                    <button class="btn btn-sm btn-primary" data-confirm="${r.id}">Confirm</button>
                    <button class="btn btn-sm btn-danger" data-decline="${r.id}">Decline</button>` : ''}
                </div></td>
              </tr>`;
            }).join('') || `<tr><td colspan="7"><div class="empty-state">${ICONS.empty}<div>No booking requests yet</div><div class="cell-sub" style="margin-top:6px;">Requests appear here when a patient books through the patient portal.</div></div></td></tr>`}
          </tbody>
        </table>

  $('#requestSearch').addEventListener('input', e => { filters.requests = e.target.value; renderRequests(c); });

  $$('[data-decline]', c).forEach(b => b.addEventListener('click', () => declineRequestForm(state.requests.find(r=>r.id===b.dataset.decline))));
