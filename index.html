async function refreshRequests(){
  await refreshCollection('requests','appointment_requests',{col:'created_at',asc:false});
  await refreshCollection('patientProfiles','patient_profiles',{col:'created_at',asc:false});
}

// Best-effort split of the freeform name the patient typed into the portal:
// first word is the given name, everything after it is the surname — the
// same convention patientForm() already uses when back-filling legacy rows.
function splitPatientName(full){
  const parts = String(full||'').trim().split(/\s+/).filter(Boolean);
  return { first: parts[0] || '', last: parts.slice(1).join(' ') || '' };
}

function confirmRequestForm(req){
  if (!req) return;
  const alreadyLinked = linkedPatientFor(req.patient_user_id);
  const { first, last } = splitPatientName(req.patient_name);
  const patientOptions = [
    {value:'__new__', label:'+ Create a new patient record'},
    ...state.patients
      .slice()
      .sort((a,b)=> patientDisplayName(a).localeCompare(patientDisplayName(b)))
      .map(p => ({ value:p.id, label:`${patientDisplayName(p)}${p.patient_code ? ' · '+p.patient_code : ''}` })),
  ];

  // If the patient named a doctor, pre-select that person — as a helpful
  // default only; staff can change it, and nothing is assigned by it. Patients
  // type the name freehand, so match loosely ("Aquino" -> "Dr. Marcus Aquino")
  // and, when nothing on the roster matches, offer their exact words rather
  // than silently dropping them.
  const staffNames = state.staff.map(s=>s.name).filter(Boolean);
  const pref = (req.physician_preference || '').trim();
  const prefLower = pref.toLowerCase();
  const prefMatch = !pref ? '' : (
    staffNames.find(n => n.toLowerCase() === prefLower)
    || staffNames.find(n => n.toLowerCase().includes(prefLower))
    || staffNames.find(n => prefLower.includes(n.toLowerCase()))
    || ''
  );
  const doctorOptions = [{value:'',label:'— To be assigned —'}, ...staffNames];
  if (pref && !prefMatch) doctorOptions.push({value:pref, label:`${pref} (as the patient wrote it)`});

  // `type` is the short "Visit type" label the Appointments page shows in its
  // Type column ("Chest X-ray", "Follow-up"). The service(s) the patient
  // ticked are exactly that kind of label, so they lead; the patient's own
  // words follow after an em dash when they gave a reason too.
  const svc = (req.service_type || '').trim();
  const reason = (req.reason || '').trim();
  const suggestedType = [svc, reason].filter(Boolean).join(' — ');

  openModal({
    title: 'Confirm booking request',
    submitLabel: 'Confirm & schedule',
    notice: alreadyLinked
      ? `This portal account is already linked to ${patientDisplayName(alreadyLinked)}. Keep that chart selected unless it's the wrong person.`
      : `Link this request to a patient chart. The account holder will then be able to see this appointment in the portal — and nothing else.`,
    initial: {
      patient_link: alreadyLinked ? alreadyLinked.id : '__new__',
      first_name: first,
      last_name: last,
      phone: req.contact_phone || '',
      email: req.contact_email || '',
      appt_date: req.preferred_date || todayISO(0),
      appt_time: req.preferred_time || '09:00',
      type: suggestedType,
      doctor: prefMatch || pref || '',
    },
    fields: [
      {key:'patient_link', label:'Patient chart', type:'select', options:patientOptions, section:'Patient record',
       hint:'Pick the existing chart this person already has, or create a new one below.'},
      {key:'first_name', label:'First name', section:'New patient details (used only if creating a new record)'},
      {key:'last_name', label:'Last name'},
      {key:'phone', label:'Contact number'},
      {key:'email', label:'Email', type:'email'},
      {key:'doctor', label:'Doctor', type:'select', section:'Appointment', options:doctorOptions,
       hint: pref
         ? `The patient asked for “${pref}” — pre-filled as a suggestion only. Change it freely.`
         : 'The patient didn’t ask for anyone in particular.'},
      {key:'appt_date', label:'Date', type:'date', required:true},
      {key:'appt_time', label:'Time', type:'time', required:true},
      {key:'type', label:'Visit type',
       hint: svc ? `Service${svc.includes(',')?'s':''} the patient ticked: ${svc}` : undefined},
      {key:'staff_notes', label:'Note for the record', type:'textarea'},
    ],
    async onSubmit(data){
      let patientId = data.patient_link;
      let patientName;

      if (patientId === '__new__'){
        const f = (data.first_name||'').trim();
        const l = (data.last_name||'').trim();
        if (!f && !l) throw new Error('Enter a first and last name for the new patient record.');
        const name = [f, l].filter(Boolean).join(' ');
        const { data: created, error } = await sb.from('patients').insert({
          name, first_name: f, last_name: l,
          phone: data.phone || null,
          email: data.email || null,
          chief_complaint: req.reason || null,
        }).select().single();
        if (error) throw error;
        patientId = created.id;
        patientName = created.name;
      } else {
        const p = state.patients.find(p => p.id === patientId);
        if (!p) throw new Error('Choose a patient chart to link this request to.');
        patientName = p.name;
      }

      // Link the portal account to the chart, so the patient can see this
      // appointment (and only appointments on this chart) in the portal.
      const { error: linkErr } = await sb.from('patient_profiles')
        .update({ patient_id: patientId }).eq('id', req.patient_user_id);
      if (linkErr) throw linkErr;

      // `patient` (free text) is kept in sync with `patient_id` because the
      // rest of the app still matches appointments to patients by name.
      const { error: apptErr } = await sb.from('appointments').insert({
        patient_id: patientId,
        patient: patientName,
        doctor: data.doctor || null,
        appt_date: data.appt_date,
        appt_time: data.appt_time || '09:00',
        type: data.type || null,
        status: 'Scheduled',
      });
      if (apptErr) throw apptErr;

      const { error: reqErr } = await sb.from('appointment_requests')
        .update({ status:'confirmed', staff_notes: data.staff_notes || null }).eq('id', req.id);
      if (reqErr) throw reqErr;

      // If the patient ticked X-ray and/or Laboratory when they booked, place
      // matching pending orders here automatically so staff never have to
      // re-type what the patient already told us on the Diagnostics page.
      // "Consultation only" and "Animal bite treatment" don't map to a lab/
      // imaging order, so they're left for the visit itself.
      const requestedServices = (req.service_type || '').split(',').map(s => s.trim());
      const diagnosticTests = ['X-ray', 'Laboratory'].filter(test =>
        requestedServices.some(s => s.toLowerCase() === test.toLowerCase())
      );
      if (diagnosticTests.length){
        const { error: labErr } = await sb.from('lab_orders').insert(
          diagnosticTests.map(test => ({
            patient: patientName,
            test,
            category: test === 'X-ray' ? 'Radiology' : 'Laboratory',
            ordered_date: data.appt_date,
            status: 'Pending',
          }))
        );
        if (labErr) throw labErr;
        await refreshCollection('labOrders','lab_orders',{col:'ordered_date',asc:false});
      }

      await refreshCollection('patients','patients',{col:'created_at',asc:false});
      await refreshCollection('appointments','appointments',{col:'appt_date',asc:false});
      await refreshRequests();
      await logActivity(`Booking request confirmed: ${patientName} (${data.appt_date} ${data.appt_time})${diagnosticTests.length ? ` — ${diagnosticTests.join(', ')} order${diagnosticTests.length>1?'s':''} added to Diagnostics` : ''} — by ${currentUser.name}`);
      await refreshActivity();
      toast(diagnosticTests.length
        ? `Request confirmed — appointment scheduled, ${diagnosticTests.join(' + ')} order${diagnosticTests.length>1?'s':''} added to Diagnostics`
        : 'Request confirmed — appointment scheduled');
      renderNav();
      renderView();
    }
  });
}

function declineRequestForm(req){
  if (!req) return;
  openModal({
    title: 'Decline booking request',
    submitLabel: 'Decline request',
    notice: `${req.patient_name} will see this request marked as declined in the patient portal.`,
    initial: { staff_notes: '' },
    fields: [
      {key:'staff_notes', label:'Reason (optional)', type:'textarea',
       placeholder:'e.g. Fully booked that day — please request another date.'},
    ],
    async onSubmit(data){
      const { error } = await sb.from('appointment_requests')
        .update({ status:'declined', staff_notes: data.staff_notes || null }).eq('id', req.id);
      if (error) throw error;
      await refreshRequests();
      await logActivity(`Booking request declined: ${req.patient_name} — by ${currentUser.name}`);
      await refreshActivity();
      toast('Request declined');
      renderNav();
      renderView();
    }
  });
}

/* ---------- Diagnostics / Labs ---------- */
// Priority, specimen, sample status and fasting tags shown under a laboratory test name.
function labMetaHtml(l){
  const chips = [];
  if (orderPriority(l) === 'Stat') chips.push('<span class="chip chip-critical"><span class="dot"></span>STAT</span>');
  if (l.specimen_type) chips.push(`<span class="chip chip-neutral"><span class="dot"></span>${esc(l.specimen_type)}</span>`);
  if (l.sample_status) chips.push(`<span class="chip ${l.sample_status === 'Acceptable' ? 'chip-good' : 'chip-critical'}"><span class="dot"></span>${esc(l.sample_status)}</span>`);
  if (needsFasting(l.test)) chips.push(`<span class="chip ${l.fasting_status === 'Yes' ? 'chip-good' : l.fasting_status === 'No' ? 'chip-critical' : 'chip-neutral'}"><span class="dot"></span>Fasting 10–12 h: ${l.fasting_status || 'not recorded'}</span>`);
  return chips.length ? `<div style="margin-top:6px; display:flex; flex-wrap:wrap; gap:4px;">${chips.join('')}</div>` : '';
}
function labOrderTable(title, rows, idPrefix){

          <tbody>
            ${rows.map(l=>`
              <tr>
                <td>${nameWithEmail(l.patient)}</td>
                <td>${esc(l.test)}${orderDept(l) === 'Laboratory' ? labMetaHtml(l) : ''}${orderPackageParts(l).length ? `<div class="cell-sub" style="margin-top:6px;"><span class="chip chip-accent"><span class="dot"></span>PACKAGE</span></div><ul class="pkg-list">${orderPackageParts(l).map(x => RADIO_PART_RE.test(x) ? `<li>${esc(x)} <span class="chip chip-neutral" style="padding:1px 7px;">in Radiology</span></li>` : `<li>${esc(x)}</li>`).join('')}</ul>` : ''}</td>

                <td class="cell-sub">${l.validated_by ? esc(l.validated_by) + '<div>' + credentialHtml(l.validated_by, true) + '</div>' : '<span style="color:var(--ink-muted)">—</span>'}</td>

                <td><div class="row-actions">
                  ${canBill() && !isBilled(l) && priceFor(l) != null ? `<button class="btn btn-sm" data-billorder="${l.id}">Bill</button>` : ''}
                  <button class="icon-btn" data-edit="${l.id}">${ICONS.edit}</button>
                  ${canDelete() ? `<button class="icon-btn" data-del="${l.id}">${ICONS.trash}</button>` : ''}
                </div></td>
              </tr>`).join('') || `<tr><td colspan="9"><div class="empty-state">${ICONS.empty}<div>No orders found</div></div></td></tr>`}
          </tbody>
        </table>

}
function renderLabs(c, dept){
  dept = dept || 'Laboratory';
  const isRad = dept === 'Radiology';
  const filterKey = isRad ? 'radiology' : 'labs';
  const myOrders = visibleLabOrders();
  const access = currentUser.access_role === 'admin' ? 'all' : (currentUser.diagnostics_access || 'all');

  const deptOrders = myOrders.filter(l => orderDept(l) === (isRad ? 'Radiology' : 'Laboratory'));
  setHeader(isRad ? 'Radiology' : 'Laboratory', `${deptOrders.length} ${isRad ? 'radiology / imaging' : 'laboratory'} order${deptOrders.length===1?'':'s'}`);

  const q = (filters[filterKey] || '').toLowerCase();
  const matches = l => l.patient.toLowerCase().includes(q) || l.test.toLowerCase().includes(q) || codeFor(l.patient).toLowerCase().includes(q);
  const sorted = myOrders.slice().sort((a,b)=> b.ordered_date.localeCompare(a.ordered_date));
  const labRows = sorted.filter(l => orderDept(l) === 'Laboratory' && matches(l));
  const radRows = sorted.filter(l => orderDept(l) === 'Radiology' && matches(l));

  c.innerHTML = `
    <div class="panel" style="padding-bottom:12px;">
      <div class="search-wrap">${ICONS.search}<input class="search-input" id="labSearch" placeholder="Search by patient, code or test…" value="${esc(filters[filterKey] || '')}"></div>
      ${access !== 'all' ? `<div class="cell-sub">You're set to see ${access === 'laboratory' ? 'Laboratory' : 'Radiology / Imaging'} orders only. An administrator can change this on the Staff page.</div>` : ''}
    </div>
    ${isRad ? labOrderTable('Radiology / Imaging requests', radRows) : labOrderTable('Laboratory requests', labRows)}
  `;

  $('#labSearch').addEventListener('input', e => { filters[filterKey] = e.target.value; renderLabs(c, dept); });
  $$('[data-billorder]', c).forEach(b => b.addEventListener('click', async () => {
    const o = myOrders.find(l => String(l.id) === b.dataset.billorder); if (!o) return;
    if (!confirm(`Create an Unpaid invoice of ${fmtMoney(priceFor(o))} for ${o.patient} (${o.test})?`)) return;
    b.disabled = true;
    try { const amt = await billOrders(o.patient, [o]); toast(`Invoice ${fmtMoney(amt)} created in Billing`); }
    catch(e){ toast(friendlyError(e)); }
    renderLabs(c, dept);
  }));
  $$('[data-edit]', c).forEach(b => b.addEventListener('click', () => labForm(myOrders.find(l=>l.id===b.dataset.edit))));
  $$('[data-del]', c).forEach(b => b.addEventListener('click', async () => {
    if (!confirm('Remove this lab/imaging order?')) return;
    const { error } = await sb.from('lab_orders').delete().eq('id', b.dataset.del);
    if (error) return toast(friendlyError(error));
    await refreshCollection('labOrders','lab_orders',{col:'ordered_date',asc:false}); await refreshActivity();
    toast('Order removed'); renderLabs(c, dept);
  }));
}
// Staff offered in the "Performed by" / "Validated by" dropdowns: medical technologists for Laboratory,
// radiologic technologists for Radiology (matched on the Role / title typed on the Staff page).
// If nobody has that role yet, every staff member is offered so the form is never blocked.
const SPECIMEN_OPTIONS = [{value:'',label:'— Select —'},'Whole Blood','Serum','Plasma','Urine','Stool','Swab'];
const SAMPLE_STATUS_OPTIONS = [{value:'',label:'— Select —'},'Acceptable','Hemolyzed','Clotted','Insufficient Quantity (QNS)'];
const PRIORITY_OPTIONS = ['Routine','Stat'];
const FASTING_OPTIONS = [{value:'',label:'— Not recorded —'},{value:'Yes',label:'Yes — fasted 10 to 12 hours'},{value:'No',label:'No — not fasting'}];
// FBS and Lipid Profile (alone or inside a package) need 10 to 12 hours of fasting.
function needsFasting(testName){
  const nm = String(testName||'').trim().toLowerCase();
  const t = TEST_CATALOG.find(x => x.name.toLowerCase() === nm);
  return /\bfbs\b|fasting blood|lipid/i.test(nm + ' ' + ((t && t.incl) || ''));
}
function orderPriority(l){ return l.priority || (/\(stat\)/i.test(l.test||'') ? 'Stat' : 'Routine'); }
// PRC licence number and digital signature of a staff member, looked up by name.
function staffCredentials(name){
  const st = (state.staff || []).find(x => x.name && x.name === name);
  return st ? {prc: st.prc_license_no || '', sig: st.signature || ''} : {prc:'', sig:''};
}
function credentialHtml(name, compact){
  if (!name) return '';
  const c = staffCredentials(name);
  if (!c.prc && !c.sig) return compact ? '' : 'No PRC number or digital signature on file yet — an administrator can add them on the Staff page.';
  return (c.prc ? `PRC Lic. No. <strong>${esc(c.prc)}</strong>` : '') + (c.sig ? `<div><img src="${esc(c.sig)}" alt="signature" style="max-height:${compact?28:46}px; max-width:140px; background:#fff; border-radius:4px; padding:2px; margin-top:4px;"></div>` : '');
}
const RESULT_DELIVERY_OPTIONS = [{value:'',label:'— Select —'},{value:'Printed',label:'PRINTED OUT'},{value:'Emailed',label:'TO EMAIL TO CLIENT'}];
const LAB_ROLE_RE = /medical\s*technolog|med\s*tech|medtech|\bcmrt\b|\brmt\b|laborator|lab\s*tech|pathologist/i;
const RAD_ROLE_RE = /radiolog|rad\s*tech|x-?ray|\brrt\b|\brt\b|sonolog|ultrasound/i;
function techNames(category, ...keep){
  const re = category === 'Radiology' ? RAD_ROLE_RE : LAB_ROLE_RE;
  let names = state.staff.filter(s => s.name && re.test(String(s.role||'') + ' ' + String(s.dept||''))).map(s => s.name);
  if (!names.length) names = state.staff.map(s => s.name).filter(Boolean);
  keep.forEach(k => { if (k && !names.includes(k)) names.push(k); });
  return [{value:'', label:'— Select staff —'}, ...names.map(n => ({value:n, label:n}))];
}
function labForm(existing){
  // Staff can only update progress and results; the test, patient, category and date come from registration.
  const locked = !!existing && currentUser.access_role !== 'admin';
  const categoryOptions = allowedDiagCategories();
  const category = (existing && orderDept(existing)) || categoryOptions[0];
  const isLab = category === 'Laboratory';
  window.__modalCategory = category;
  const fastingNeeded = isLab && existing && needsFasting(existing.test);
  const initial = existing ? {...existing, priority: orderPriority(existing)} : {ordered_date: todayISO(0), status:'Pending', category:categoryOptions[0], priority:'Routine'};
  openModal({
    title: existing ? 'Edit order' : 'New lab / imaging order',
    submitLabel: existing ? 'Save changes' : 'Create order',
    initial,
    onOpen(overlay){
      // PRC licence number and digital signature load automatically when a staff member is picked.
      ['performed_by','validated_by'].forEach(k => {
        const sel = overlay.querySelector(`[name="${k}"]`); if (!sel) return;
        const box = document.createElement('div'); box.className = 'field-hint'; box.style.marginTop = '6px';
        sel.closest('.field').appendChild(box);
        const upd = () => { box.innerHTML = credentialHtml(sel.value, false); };
        sel.addEventListener('change', upd); upd();
      });
    },
    fields: [
      {key:'patient', label:'Patient name', required:true, disabled:locked, hint: existing ? [phoneFor(existing.patient) && 'Mobile No.: ' + phoneFor(existing.patient), emailFor(existing.patient) && 'Email: ' + emailFor(existing.patient)].filter(Boolean).join('   ·   ') : ''},
      locked ? {key:'test', label:'Test / study', disabled:true, hint:'Set when the patient was registered. Only an administrator can change it.'}
             : {key:'test', label:'Test / study', type:'testpicker'},
      {key:'ordered_date', label:'Order date', type:'date', disabled:locked},
      {key:'status', label:'Status', type:'select', options:['Pending','In Progress','Completed']},
      ...(isLab ? [
        {key:'priority', label:'Priority tracking', type:'select', options: PRIORITY_OPTIONS, section:'Specimen & priority'},
        {key:'specimen_type', label:'Specimen type', type:'select', options: SPECIMEN_OPTIONS},
        {key:'sample_status', label:'Sample status', type:'select', options: SAMPLE_STATUS_OPTIONS},
      ] : []),
      ...(fastingNeeded ? [{key:'fasting_status', label:'Pre-test instruction: fasting status (10 to 12 hours fasting)', type:'select', options: FASTING_OPTIONS,
        hint:'Required preparation for FBS and Lipid Profile.'}] : []),
      {key:'performed_by', label:'Performed by (staff who did the service)', type:'select', options: techNames(category, existing && existing.performed_by), section:'Staff'},
      {key:'validated_by', label:'Validated by (staff who checked / released the result)', type:'select', options: techNames(category, existing && existing.validated_by),
       hint: category === 'Radiology' ? 'Listed: staff whose Role / title says Radiologic Technologist or Radiologist (set on the Staff page).' : 'Listed: staff whose Role / title says Medical Technologist (e.g. CMRT) or Pathologist (set on the Staff page).'},
      {key:'result', label: isLab ? '⚠ Critical Value Warning' : 'Result notes', type:'textarea', section:'Result'},
      {key:'result_delivery', label:'RESULT SENDOUT', type:'select', options: RESULT_DELIVERY_OPTIONS},
    ],
    async onSubmit(data){
      ['specimen_type','sample_status','fasting_status'].forEach(k => { if (!data[k] && !(existing && existing[k])) delete data[k]; });
      if (data.priority === 'Routine' && !(existing && existing.priority)) delete data.priority;
      if (!data.result_delivery && !(existing && existing.result_delivery)) delete data.result_delivery;
      data.performed_by = String(data.performed_by||'').trim();
      data.validated_by = String(data.validated_by||'').trim();
      ['performed_by','validated_by'].forEach(k => { if (!data[k] && !(existing && existing[k])) delete data[k]; });
      data.test = String(data.test||'').trim();
      { const known = TEST_CATALOG.find(t => t.name === data.test); data.category = known ? known.cat : (existing && existing.category) || category; }
      if (!data.test) throw new Error('Please choose a test / study (or pick "Other" and type one).');
      let invoiceNote = '';
      if (existing){
        if (labAwaitingPayment(existing) && existing.status === 'Pending' && data.status !== 'Pending'){
          const inv = labInvoice(existing);
          throw new Error(`The patient has not paid yet (invoice ${fmtMoney(inv.amount)} is Unpaid). Mark the invoice as Paid in Billing first, then you can start this procedure.`);
        }
      } else {
        const cat = TEST_CATALOG.find(t => t.cat === data.category && t.name === data.test);
        if (cat){
          const invId = await createVisitInvoice(data.patient, [{label:data.test, price:cat.price}]);
          if (invId != null){ data.invoice_id = invId; invoiceNote = ` · invoice ${fmtMoney(cat.price)} created in Billing`; }
        }
      }
      const { error } = existing
        ? await sb.from('lab_orders').update(data).eq('id', existing.id)
        : await sb.from('lab_orders').insert(data);

      await refreshActivity();
      toast((existing ? 'Order updated' : 'Order created') + invoiceNote);
      renderView();
    }
  });
}

/* ---------- Printable bill / receipt ---------- */
function invoiceLines(inv){
  const linked = (state.labOrders || []).filter(l => l.invoice_id != null && String(l.invoice_id) === String(inv.id));
  const amount = Number(inv.amount || 0);
  if (!linked.length) return [{label: inv.description || 'Services', price: amount}];
  if (linked.some(l => priceFor(l) == null)) return [{label: inv.description || 'Services', price: amount}];
  const lines = linked.map(l => ({label: l.test, price: priceFor(l)}));
  const rest = amount - lines.reduce((a,x) => a + x.price, 0);
  if (rest < -0.005) return [{label: inv.description || 'Services', price: amount}]; // prices changed since billing
  if (rest > 0.005) lines.unshift({label: /consult/i.test(inv.description||'') ? "Doctor's consultation (on-site)" : 'Other charges', price: rest});
  return lines;
}

function invoiceForm(existing, prefillPatient){
  openModal({
    title: existing ? 'Edit invoice' : 'New invoice',
    submitLabel: existing ? 'Save changes' : 'Create invoice',
    initial: existing || {invoice_date: todayISO(0), status:'Unpaid', discount:0, method:'Cash', patient: prefillPatient || ''},
    fields: [
      {key:'patient', label:'Patient name', required:true, datalist: state.patients.map(p => p.name), hint:'Pick a registered patient from the list so the patient code shows up.'},
      {key:'payor', label:'Payor', hint:'Who actually paid, if that’s not the patient (e.g. a relative). Leave blank to use the patient’s name.'},
      {key:'description', label:'Description', required:true},
      {key:'amount', label:'Amount (₱)', type:'number', required:true},
      {key:'discount', label:'Discount (₱)', type:'number', hint:'Leave at 0 if there’s no discount.'},
      {key:'method', label:'Payment method', type:'select', options:[{value:'',label:'— Not recorded —'},'Cash','Card','GCash','Bank transfer']},
      {key:'invoice_date', label:'Invoice date', type:'date'},
      {key:'status', label:'Status', type:'select', options:['Unpaid','Paid']},
    ],
    async onSubmit(raw){
      // `or_no` is deliberately not a field here — the database assigns the
      // official receipt number on insert and it is never edited by hand.
      const data = {...raw};
      if (!String(data.payor || '').trim()) data.payor = data.patient;
      data.discount = Number(data.discount) || 0;
      if (!data.method) data.method = null;
      const { error } = existing
        ? await sb.from('invoices').update(data).eq('id', existing.id)
        : await sb.from('invoices').insert(data);
      if (error) throw error;
      await refreshCollection('invoices','invoices',{col:'invoice_date',asc:false});
      await logActivity(`Invoice ${existing?'updated':'created'}: ${data.description} (${data.patient}) — by ${currentUser.name}`);
      await refreshActivity();
      toast(existing ? 'Invoice updated' : 'Invoice created');
      renderView();
    }
  });
}

/* ---------- Financial ---------- */
/*
  A Philippine "BIR Manual Books of Accounts" style bookkeeping page for a
  Non-VAT (Percentage Tax) service business. Nothing on this page is typed
  twice: the Sales Journal is generated from the invoices that were actually
  marked Paid on the Billing page, and the two books below it are recorded
  straight into their own tables. The older free-form `financial_entries`
  table is left untouched — it is simply no longer this page's data source.
*/

// From / To for every card on the page. Defaults to the 1st of the current
// month through today, which is the range a bookkeeper works in.
let financialRange = null;
function defaultFinancialRange(){
  const today = todayISO(0);
  return { from: today.slice(0, 8) + '01', to: today };
}

const EXPENSE_CATEGORIES = ['Supplies','Utilities','Rent','Salaries','Equipment','Other'];
const DISBURSEMENT_PARTICULARS = ["Doctor's Daily Fee",'Staff Advance','Petty Cash','Other'];
const PAYMENT_STATUSES = ['Paid','Pending'];

/* ---- CSV export helpers (no library — a Blob + a download link) ---- */

// RFC 4180 quoting: a field is wrapped in double quotes whenever it contains
// a comma, a double quote, or a line break, and any double quote inside it is
// doubled. That's what keeps a payor like `Reyes, Ana "Nene"` or a
// description with a newline from splitting into extra columns.
function csvField(value){
  const s = (value === null || value === undefined) ? '' : String(value);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
// Amounts go into the CSV as plain numbers ("1850.00") with no ₱ sign and no
// thousands separators, so Excel/Sheets read them as numbers you can total.
function csvAmount(n){ return Number(n || 0).toFixed(2); }
function buildCSV(headers, rows){
  return [headers, ...rows].map(r => r.map(csvField).join(',')).join('\r\n');
}
function invoiceNet(i){ return Number(i.amount || 0) - Number(i.discount || 0); }

function salesJournalCSV(rows){
  const body = rows.map(i => [
    i.invoice_date || '', i.or_no || '', i.payor || i.patient || '', i.description || '',
    csvAmount(i.discount), i.method || '', csvAmount(i.amount), csvAmount(invoiceNet(i)),
  ]);
  body.push(['TOTAL','','','', csvAmount(rows.reduce((s,i)=>s+Number(i.discount||0),0)), '',
    csvAmount(rows.reduce((s,i)=>s+Number(i.amount||0),0)), csvAmount(rows.reduce((s,i)=>s+invoiceNet(i),0))]);
  return buildCSV(['Date','OR No.','Payor','Particulars','Discount','Method','Amount','Net Amount'], body);
}
function expensesCSV(rows){
  const body = rows.map(e => [
    e.expense_date || '', e.category || '', e.description || '', e.paid_to || '',
    csvAmount(e.amount), e.status || '',
  ]);
  body.push(['TOTAL','','','', csvAmount(rows.reduce((s,e)=>s+Number(e.amount||0),0)), '']);
  return buildCSV(['Date','Category','Description','Paid To','Amount','Status'], body);
}
function disbursementsCSV(rows){
  const body = rows.map(d => [
    d.disb_date || '', d.particulars || '', d.reason || '', csvAmount(d.amount),
    d.given_to || '', d.status || '',
  ]);
  body.push(['TOTAL','','', csvAmount(rows.reduce((s,d)=>s+Number(d.amount||0),0)), '', '']);
  return buildCSV(['Date','Particulars','Reason','Amount','Given To','Status'], body);
}
// The bottom line, as its own small sheet:
// Total Revenue − Total Expenses − Total Cash Disbursement = Net Profit.
function fullReportCSV(s){
  return buildCSV(['Line','From','To','Amount'], [
    ['Total Revenue (paid invoices, net of discount)', s.from, s.to, csvAmount(s.totalRevenue)],
    ['Less: Total Expenses', s.from, s.to, csvAmount(s.totalExpenses)],
    ['Less: Total Cash Disbursement', s.from, s.to, csvAmount(s.totalCashDisb)],
    ['NET PROFIT', s.from, s.to, csvAmount(s.netProfit)],
  ]);
}

function downloadCSV(filename, csv){
  // The BOM is what makes Excel open a UTF-8 CSV with the right characters.
  const blob = new Blob(['﻿' + csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

      <div class="table-wrap">
        <table>
          <thead><tr><th>Patient</th><th>Due date</th><th>Note</th><th>Status</th><th></th></tr></thead>
          <tbody>
            ${rows.map(f=>`
              <tr>
                <td class="cell-name">${esc(f.patient)}</td>
                <td class="mono">${fmtDateShort(f.due_date)}${f.status==='pending' && f.due_date<today ? ' <span class="chip chip-critical"><span class="dot"></span>Overdue</span>' : ''}</td>
                <td class="cell-sub">${esc(f.note||'')}</td>
                <td>${f.status==='completed' ? '<span class="chip chip-good"><span class="dot"></span>Completed</span>' : '<span class="chip chip-warn"><span class="dot"></span>Pending</span>'}</td>
                <td><div class="row-actions">
                  ${f.status!=='completed' ? `<button class="btn btn-sm" data-complete="${f.id}">Mark done</button>` : ''}
                  <button class="icon-btn" data-edit="${f.id}">${ICONS.edit}</button>
                  <button class="icon-btn" data-del="${f.id}">${ICONS.trash}</button>
                </div></td>
              </tr>`).join('') || `<tr><td colspan="5"><div class="empty-state">${ICONS.empty}<div>No follow-ups match your search</div></div></td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;

  $('#followUpSearch').addEventListener('input', e => { filters.reminders = e.target.value; renderReminders(c); });
  $('#addFollowUp').addEventListener('click', () => followUpForm());
  $$('[data-edit]', c).forEach(b => b.addEventListener('click', () => followUpForm(state.followUps.find(f=>f.id===b.dataset.edit))));
  $$('[data-del]', c).forEach(b => b.addEventListener('click', async () => {
    if (!confirm('Remove this follow-up reminder?')) return;
    const { error } = await sb.from('follow_ups').delete().eq('id', b.dataset.del);
    if (error) return toast(friendlyError(error));
    await refreshCollection('followUps','follow_ups',{col:'due_date',asc:true}); await refreshActivity();
    toast('Follow-up removed'); renderReminders(c);
  }));
  $$('[data-complete]', c).forEach(b => b.addEventListener('click', async () => {
    const { error } = await sb.from('follow_ups').update({status:'completed'}).eq('id', b.dataset.complete);
    if (error) return toast(friendlyError(error));
    await refreshCollection('followUps','follow_ups',{col:'due_date',asc:true});
    await logActivity(`Follow-up marked completed — by ${currentUser.name}`);
    await refreshActivity();
    toast('Follow-up marked completed'); renderReminders(c);
  }));
}
function followUpForm(existing){
  openModal({
    title: existing ? 'Edit follow-up' : 'New follow-up',
    submitLabel: existing ? 'Save changes' : 'Add follow-up',
    initial: existing || {due_date: todayISO(0), status:'pending'},
    fields: [
      {key:'patient', label:'Patient name', required:true},
      {key:'due_date', label:'Due date', type:'date', required:true},
      {key:'note', label:'Note', type:'textarea'},
      {key:'status', label:'Status', type:'select', options:[{value:'pending',label:'Pending'},{value:'completed',label:'Completed'}]},
    ],
    async onSubmit(data){
      const { error } = existing
        ? await sb.from('follow_ups').update(data).eq('id', existing.id)
        : await sb.from('follow_ups').insert(data);
      if (error) throw error;
      await refreshCollection('followUps','follow_ups',{col:'due_date',asc:true});
      await logActivity(`Follow-up ${existing?'updated':'added'}: ${data.patient} due ${data.due_date} — by ${currentUser.name}`);
      await refreshActivity();
      toast(existing ? 'Follow-up updated' : 'Follow-up added');
      renderView();
    }
  });
}

/* ============================================================
   Theme
   ============================================================ */
function toggleTheme(){
  const root = document.documentElement;
  const current = root.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = current === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  try{ localStorage.setItem('clover-theme', next); }catch(e){}
  updateThemeLabel();
}
function updateThemeLabel(){
  const root = document.documentElement;
  const explicit = root.getAttribute('data-theme');
  const isDark = explicit ? explicit === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  const label = $('#themeLabel');
  if (label) label.textContent = isDark ? 'Light mode' : 'Dark mode';
}
(function initTheme(){
  try{
    const saved = localStorage.getItem('clover-theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  }catch(e){}
})();

/* ============================================================
   Boot
   ============================================================ */
async function establishSession(session){
  if (!session){ renderLogin(); return; }
  const { data: profile, error } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
  if (error || !profile){
    renderLogin('Your login exists, but no staff profile is set up for it yet. Ask your administrator to check the Supabase dashboard.');
    return;
  }
  currentUser = { id: session.user.id, email: session.user.email, ...profile };
  try{
    await loadAllData();
    renderShell();
    renderView();
  }catch(err){
    renderLogin(friendlyError(err));
  }
}

async function boot(){
  if (!configOk){ renderConfigMissing(); return; }
  $('#app').innerHTML = `<div class="skeleton-wrap">Loading Clover Life Healthcare Diagnostic Clinic…</div>`;
  const { data } = await sb.auth.getSession();
  await establishSession(data.session);
  sb.auth.onAuthStateChange((event) => {
    if (event === 'SIGNED_OUT'){ currentUser = null; state = null; renderLogin(); }
  });
}
boot();

})();
</script>
